<!doctype html>
<html lang="en">
<head>
<script src="../runtime.js" data-server="srv/dev/server.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kilimanjaro Camps · demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Smooch+Sans:wght@800&family=Work+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../client/camps-game.css">
<style>
/* Демо карты 3 без сервера (file://). ?level=practice|c1|c2|summit&seed=любая-строка&solve=1 (показать решённым) */
:root{--bg:#100128;--muted:rgba(255,255,255,.72);--y:#F1D627;--g:#49F623;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% -10%,#3a0a9a 0%,#100128 60%);min-height:100vh;color:#fff;font:500 16px/1.5 "Work Sans",system-ui,sans-serif;overflow-x:hidden}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0}
header img{height:30px}
header small{color:var(--muted);font-size:.82rem}
h1{margin:6px 0 0;font:800 clamp(2.2rem,6vw,3.8rem)/.9 "Smooch Sans",sans-serif;text-transform:uppercase}
h1 span{color:var(--y)}
.lede{color:var(--muted);margin:10px 0 16px;max-width:62ch}
.levels{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.levels a{font:800 18px/1 "Smooch Sans",sans-serif;text-transform:uppercase;text-decoration:none;color:#100128;background:#F9F5FF;padding:8px 12px;border-radius:8px;box-shadow:0 3px 0 #b9a8d6}
.levels a.on{background:linear-gradient(#71F854,#2FDC09);box-shadow:0 3px 0 #1f9a06}
.panel{background:linear-gradient(180deg,#5C05E5 0%,#3a0a9a 100%);padding:20px;border-radius:16px;box-shadow:0 -24px 204px -70px #00EE3B;max-width:560px;margin:0 auto 40px}
@media (max-width:520px){.wrap{padding:0 12px}.panel{padding:16px 12px}h1{font-size:2.2rem}.lede{font-size:.9rem}}
</style>
</head>
<body>
<div class="wrap">
  <header><img src="../../assets/sprites/logo.webp" alt="Jumanza"><small>Map 3 demo · local check</small></header>
  <h1>Kilimanjaro <span>camps</span></h1>
  <p class="lede">High on the mountain the safari needs a camp for the night. One tent for every tree, and no two tents side by side.</p>
  <nav class="levels" id="levels"></nav>
  <div class="panel"><div id="game"></div></div>
</div>
<script src="../shared/camps.js"></script>
<script src="../client/camps-game.js"></script>
<script>
(function () {
  var C = window.Camps;
  var qs = new URLSearchParams(location.search);
  var level = C.LEVELS[qs.get('level')] ? qs.get('level') : 'c1';
  var seed = qs.get('seed') || String(Math.floor(Math.random() * 1e9));
  var OWN = { practice: ['Practice camp', 'Base camp'], c1: ['Alpine camp', 'Alpine desert'], c2: ['Glacier camp', 'Glacier'], summit: ['The summit', 'Christmas tree on the peak'] };

  var nav = document.getElementById('levels');
  Object.keys(C.LEVELS).forEach(function (id) {
    var a = document.createElement('a');
    a.href = '?level=' + id + '&seed=' + encodeURIComponent(seed);
    a.textContent = id === 'c1' ? 'Camp 1 · 6×6' : id === 'c2' ? 'Camp 2 · 7×7' : id === 'summit' ? 'Summit · 8×8' : 'Practice · 5×5';
    if (id === level) a.className = 'on';
    nav.appendChild(a);
  });

  // локальная копия серверной логики (server/camps.js move) — только для демо
  var g = C.generate(level, seed);
  var st = { puzzle: g.puzzle, solution: g.solution, marks: new Array(g.puzzle.N * g.puzzle.N).fill(0), sets: 0, hintsLeft: 3, solved: false, peek: null };
  if (qs.get('solve')) { g.solution.forEach(function (i) { st.marks[i] = 2; }); st.solved = true; }
  else if (qs.get('wip')) { // наполовину: пара палаток, снег, одна ошибка — для скриншота
    g.solution.slice(0, Math.ceil(g.solution.length / 2)).forEach(function (i) { st.marks[i] = 2; });
    var sol = new Set(g.solution), tr = new Set(g.puzzle.trees.concat(g.puzzle.blocked)), k = 0;
    for (var i = 0; i < st.marks.length && k < 6; i++) if (!sol.has(i) && !tr.has(i) && st.marks[i] === 0 && i % 3 === 0) { st.marks[i] = 1; k++; }
  }
  function view() {
    var pz = st.puzzle;
    return { game: 'camps', level: level, camps: level, title: OWN[level][0], zone: OWN[level][1], summit: level === 'summit', training: level === 'practice',
      N: pz.N, trees: pz.trees, blocked: pz.blocked, rows: pz.rows, cols: pz.cols, marks: st.marks.slice(), sets: st.sets,
      hintsLeft: st.hintsLeft, solved: st.solved, done: st.solved, peek: st.peek };
  }
  function move(input) {
    var pz = st.puzzle, fixed = new Set(pz.trees.concat(pz.blocked));
    st.peek = null;
    if (st.solved) return { error: 'finished' };
    if (input.do === 'set') {
      for (var j = 0; j < input.s.length; j++) { var c = input.s[j]; if (fixed.has(c[0])) return { error: 'bad_cell' }; st.marks[c[0]] = c[1]; }
      st.sets += input.s.length;
    } else if (input.do === 'reset') st.marks = st.marks.map(function () { return 0; });
    else if (input.do === 'hint') {
      if (st.hintsLeft < 1) return { error: 'no_hints' };
      var h = C.hint(pz, st.marks, st.solution);
      if (!h) return { error: 'no_path' };
      if (h.kind === 'wrong') st.marks[h.cell] = 1; else { st.marks[h.cell] = 2; h.clear.forEach(function (n) { st.marks[n] = 1; }); }
      st.peek = h; st.hintsLeft--;
    }
    if (C.check(pz, C.tentsOf(st.marks)).ok) st.solved = true;
    return {};
  }
  var game = window.CampsGame.mount(document.getElementById('game'), {
    sprites: '../../assets/sprites/',
    move: function (input) { var r = move(input); return Promise.resolve({ error: r.error, attempt: { view: view() } }); },
    onDone: function () { /* в ивенте — назад на гору */ },
  });
  game.load({ view: view() });
})();
</script>
</body>
</html>
