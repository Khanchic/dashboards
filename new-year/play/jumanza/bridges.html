<!doctype html>
<html lang="en">
<head>
<script src="../runtime.js" data-server="srv/dev/server.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Safari Bridges · demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Smooch+Sans:wght@800&family=Work+Sans:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../client/bridges-game.css">
<!--
  Демо карты 2 без сервера (открывается по file://). Логика хода — настоящий server/bridges.js в браузере.
  Параметры URL: ?level=practice|b1|b2 &seed=строка &fill=N (положить N брёвен эталона — для скриншотов)
                 &wrong=1 (добавить одно неверное бревно) &sel=i (выделить камень i) &solve=1 (решено)
-->
<style>
:root{--bg:#100128;--y:#F1D627;--g:#49F623;--p:#5C05E5;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% -10%,#3a0a9a 0%,#100128 60%);background-color:#100128;min-height:100vh;color:#fff;font:500 16px/1.5 "Work Sans",system-ui,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header img{height:30px}
h1{margin:10px 0 4px;font:800 clamp(2.2rem,6vw,3.6rem)/.9 "Smooch Sans",sans-serif;text-transform:uppercase}
h1 span{color:var(--y)}
.lede{color:rgba(255,255,255,.72);margin:6px 0 16px;max-width:62ch;font-size:.95rem}
.lv{display:flex;gap:8px;flex-wrap:wrap}
.lv a{font:800 18px/1 "Smooch Sans",sans-serif;text-transform:uppercase;text-decoration:none;color:#100128;background:#F9F5FF;padding:8px 12px;border-radius:8px;box-shadow:0 3px 0 #b9a8d6}
.lv a.on{background:linear-gradient(#71F854,#2FDC09);box-shadow:0 3px 0 #1f9a06}
.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px) minmax(0,1fr);gap:20px;align-items:start;margin-top:12px}
.stage aside{color:rgba(255,255,255,.55);font-size:.85rem;padding-top:60px}
.panel{background:linear-gradient(180deg,#5C05E5 0%,#3a0a9a 100%);padding:18px;border-radius:16px;box-shadow:0 -24px 204px -70px #00EE3B}
@media (max-width:900px){.stage{grid-template-columns:minmax(0,1fr)}.stage aside{display:none}.panel{padding:14px 10px}}
</style>
</head>
<body>
<div class="wrap">
  <header><img src="../../assets/logo.png" alt="Jumanza" onerror="this.remove()"><div class="lv" id="lv"></div></header>
  <h1>River <span>crossing</span></h1>
  <p class="lede">Map 2 of the climb. The 4x4 has to cross the mountain river: lay logs between the rocks so every rock gets exactly its number of logs.</p>
  <div class="stage">
    <aside>Demo build. Moves run through the real server logic in the browser.</aside>
    <div class="panel"><div id="game"></div></div>
    <aside></aside>
  </div>
</div>
<script src="../shared/bridges.js"></script>
<script src="../server/bridges.js"></script>
<script src="../client/bridges-game.js"></script>
<script>
(function () {
  var qs = new URLSearchParams(location.search);
  var level = qs.get('level') || 'b1';
  if (!Hashi.LEVELS[level]) level = 'b1';
  var seed = qs.get('seed') || ('demo-' + Math.random().toString(36).slice(2, 8));
  var lv = document.getElementById('lv');
  ['practice', 'b1', 'b2'].forEach(function (id) {
    var a = document.createElement('a');
    a.textContent = id === 'practice' ? 'Practice' : id === 'b1' ? 'River 1' : 'River 2';
    a.href = '?level=' + id; if (id === level) a.className = 'on';
    lv.appendChild(a);
  });
  var titles = { practice: ['Practice crossing', 'Base camp river'], b1: ['Trail 3', 'Mountain river'], b2: ['Trail 4', 'Waterfall gorge'] };
  var st = BridgesMech.create({ level: level, seed: seed, title: titles[level][0], zone: titles[level][1], training: level === 'practice' });
  // для скриншотов: частично выложить эталон / неверное бревно
  var fill = +qs.get('fill') || 0;
  if (qs.get('solve')) fill = st.solution.length;
  if (fill) BridgesMech.move(st, { do: 'bridges', s: st.solution.slice(0, fill).map(function (e) { return e.slice(); }) });
  if (qs.get('wrong')) {
    var inSol = {}; st.solution.forEach(function (e) { inSol[e[0] + ':' + e[1]] = 1; });
    var P = Hashi.pairs(st.puzzle).filter(function (p) { return !inSol[p.a + ':' + p.b]; });
    for (var i = 0; i < P.length; i++) { if (!BridgesMech.move(st, { do: 'bridges', s: [[P[i].a, P[i].b, 1]] }).error) break; }
  }
  var game = Bridges.mount(document.getElementById('game'), {
    sprites: '../../assets/sprites/',
    move: function (input) {
      var r = BridgesMech.move(st, input);
      return Promise.resolve({ attempt: { view: BridgesMech.view(st) }, error: r.error });
    },
    onDone: function () {},
  });
  game.load({ view: BridgesMech.view(st) });
  var s = qs.get('sel');
  if (s !== null) { var r = document.querySelector('.brg-rock[data-i="' + s + '"]'); if (r) { r.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, clientX: 0, clientY: 0 })); document.dispatchEvent(new PointerEvent('pointerup', { clientX: 0, clientY: 0 })); } }
})();
</script>
</body>
</html>
