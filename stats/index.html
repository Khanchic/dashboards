<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Статистика · Dashboards</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root { --bg: #070a13; --border: rgba(255,255,255,.08); --text: #f0f4fc; --text-dim: #8493b2; --brand: #00e5ff; --brand-glow: rgba(0,229,255,.28); --radius-sm: 8px; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; background: var(--bg); color: var(--text); font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; -webkit-font-smoothing: antialiased; }
.shell { display: grid; grid-template-columns: 210px 1fr; grid-template-rows: 56px 1fr; grid-template-areas: "topbar topbar" "sidebar content"; min-height: 100vh; }
@media (max-width: 768px) { .shell { grid-template-columns: 1fr; grid-template-areas: "topbar" "sidebar" "content"; } }
.topbar { grid-area: topbar; position: sticky; top: 0; z-index: 60; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; background: rgba(7,10,19,.88); backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); }
.brand-link { color: #fff; font-weight: 800; font-size: 16px; text-decoration: none; display: flex; align-items: center; gap: 8px; }
.brand-badge { background: linear-gradient(135deg, #00e5ff 0%, #2f6fed 100%); color: #050811; font-weight: 800; font-size: 11px; padding: 2px 7px; border-radius: 6px; }
.sidebar { grid-area: sidebar; position: sticky; top: 56px; align-self: start; height: calc(100vh - 56px); overflow-y: auto; background: rgba(10,14,26,.7); border-right: 1px solid var(--border); padding: 18px 12px; }
@media (max-width: 768px) { .sidebar { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--border); padding: 10px 12px; } }
.sidebar nav { display: flex; flex-direction: column; gap: 4px; }
@media (max-width: 768px) { .sidebar nav { flex-direction: row; overflow-x: auto; scrollbar-width: none; } .sidebar nav::-webkit-scrollbar { display: none; } }
.slink { color: var(--text-dim); text-decoration: none; font-size: 12.5px; font-weight: 700; letter-spacing: .02em; padding: 9px 12px; border-radius: var(--radius-sm); white-space: nowrap; display: flex; align-items: center; gap: 8px; border: 1px solid transparent; }
.slink:hover { background: rgba(255,255,255,.05); color: #fff; }
.slink.active { background: rgba(0,229,255,.12); color: #00e5ff; border-color: rgba(0,229,255,.25); box-shadow: 0 0 12px var(--brand-glow); }
.slink-highlight { color: #ffd600; background: rgba(255,214,0,.08); border-color: rgba(255,214,0,.2); }
.content { grid-area: content; min-width: 0; display: flex; flex-direction: column; }
.tabs { display: flex; gap: 6px; padding: 12px 20px; border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; position: sticky; top: 56px; z-index: 50; background: rgba(7,10,19,.92); backdrop-filter: blur(14px); }
.tab { flex: none; font: inherit; font-size: 13px; font-weight: 700; color: var(--text-dim); background: transparent; border: 1px solid var(--border); border-radius: 99px; padding: 7px 14px; cursor: pointer; text-decoration: none; }
.tab:hover { color: #fff; border-color: rgba(255,255,255,.2); }
.tab[aria-selected="true"] { color: #050811; background: var(--brand); border-color: var(--brand); }
.frame { display: block; width: 100%; flex: 1; min-height: calc(100vh - 56px - 58px); border: 0; background: var(--bg); }
</style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand-link" href="/dashboards/"><span>⚡ Dashboards Hub</span><span class="brand-badge">USA2</span></a>
      <div style="font-size:12px;color:var(--text-dim);">Итоги каналов</div>
    </header>
    <aside class="sidebar">
      <nav>
        <a href="/dashboards/" class="slink">🏠 ГЛАВНАЯ</a>
        <a href="/dashboards/smm-heatmap/" class="slink slink-highlight">⚡ SMM ХИТМАП</a>
        <a href="/dashboards/powerbi/" class="slink slink-highlight">📊 POWER BI LIVE</a>
        <a href="/dashboards/stats/" class="slink active">📈 СТАТИСТИКА</a>
        <a href="/dashboards/vegas-ds/" class="slink">🖼 ГАЛЕРЕЯ VEGAS</a>
        <a href="/dashboards/storm-ds/" class="slink">🖼 ГАЛЕРЕЯ STORM</a>
        <a href="/dashboards/promo-codes/" class="slink">🏷️ ПРОМОКОДЫ</a>
        <a href="/dashboards/chat-triage/" class="slink">💬 ЧАТ-ТРИАЖ</a>
        <a href="/dashboards/highrollers/" class="slink">💎 ХАЙРОЛЛЫ</a>
        <a href="/dashboards/reports/" class="slink">📋 ОТЧЁТЫ</a>
        <a href="/dashboards/planning/" class="slink">📅 ПЛАНИРОВАНИЕ</a>
        <a href="/dashboards/onboarding/" class="slink">🎓 ОНБОРДИНГ</a>
      </nav>
    </aside>
    <main class="content">
      <div class="tabs" role="tablist">
        <a class="tab" role="tab" href="#discord" data-key="discord" data-src="discord.html" aria-selected="false">Discord</a>
        <a class="tab" role="tab" href="#chat" data-key="chat" data-src="chat.html" aria-selected="false">Онлайн-чаты</a>
        <a class="tab" role="tab" href="#witching" data-key="witching" data-src="witching-hours.html" aria-selected="false">Witching Hours</a>
      </div>
      <iframe class="frame" id="frame" title="Статистика"></iframe>
    </main>
  </div>
<script>
(function () {
  const tabs = [...document.querySelectorAll('.tab')];
  const frame = document.getElementById('frame');
  function show(key) {
    const t = tabs.find((x) => x.dataset.key === key) || tabs[0];
    tabs.forEach((x) => x.setAttribute('aria-selected', String(x === t)));
    if (frame.getAttribute('src') !== t.dataset.src) frame.setAttribute('src', t.dataset.src);
    document.title = t.textContent + ' · Статистика';
  }
  // высота iframe = высота содержимого (same-origin), чтобы скроллилась страница, а не рамка
  frame.addEventListener('load', () => {
    try {
      const doc = frame.contentDocument;
      const fit = () => { frame.style.height = doc.documentElement.scrollHeight + 'px'; };
      fit(); new ResizeObserver(fit).observe(doc.body);
    } catch (e) {}
  });
  window.addEventListener('hashchange', () => show(location.hash.slice(1)));
  show(location.hash.slice(1));
})();
</script>
</body>
</html>
