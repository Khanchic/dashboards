<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="../common/nav.css">
</head>
<body>
<title>Haunted Week · саппорт</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Haunted Week для саппорта: дни раскрываются, в строке — время, что делать, готовый текст, код и графика. Палитра хаба. */
:root {
  --bg: #070a13; --panel: #0e1526; --panel-2: #121b30;
  --line: rgba(255,255,255,.08); --line-strong: rgba(255,255,255,.16);
  --fg: #f0f4fc; --dim: #8f9dbb; --faint: #66748f;
  --brand: #00e5ff; --brand-soft: rgba(0,229,255,.12);
  --hw: #ff8a5c; --hw-soft: rgba(255,138,92,.13);
  --ok: #2fd59a; --warn: #ffc53d;
  --font: 'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
  --r: 12px; color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f3f6fb; --panel: #ffffff; --panel-2: #eef2f8; --line: rgba(10,25,60,.10); --line-strong: rgba(10,25,60,.2);
    --fg: #0d1830; --dim: #4a5874; --faint: #7c879d; --brand: #0090a8; --brand-soft: rgba(0,144,168,.10);
    --hw: #c2501f; --hw-soft: rgba(194,80,31,.10); --ok: #12825c; --warn: #9a6400; color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f3f6fb; --panel: #ffffff; --panel-2: #eef2f8; --line: rgba(10,25,60,.10); --line-strong: rgba(10,25,60,.2);
  --fg: #0d1830; --dim: #4a5874; --faint: #7c879d; --brand: #0090a8; --brand-soft: rgba(0,144,168,.10);
  --hw: #c2501f; --hw-soft: rgba(194,80,31,.10); --ok: #12825c; --warn: #9a6400; color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.inner { max-width: 1180px; margin: 0 auto; }

.gate { min-height: 80vh; display: grid; place-items: center; padding-block: 40px; }
.gate form { width: min(360px, 100%); display: flex; flex-direction: column; gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 24px; }
.gate h1 { margin: 0; font-size: 20px; font-weight: 800; }
.gate p { margin: 0; color: var(--dim); font-size: 13px; }
.gate input { background: var(--panel-2); border: 1px solid var(--line-strong); border-radius: 9px; padding: 11px 12px; }
.gate .err { color: #ff6b7a; font-size: 13px; min-height: 1.2em; }

.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.top .inner { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-block: 12px; }
.title { font-size: 19px; font-weight: 800; letter-spacing: -.01em; margin: 0; }
.sub { color: var(--faint); font-size: 12px; }
.spacer { flex: 1; }
.btn { background: var(--panel); border: 1px solid var(--line-strong); border-radius: 9px; padding: 7px 12px; font-size: 13px; font-weight: 700; }
.btn:hover { border-color: var(--brand); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--bg); }

main { padding-block: 16px 120px; display: flex; flex-direction: column; gap: 12px; }
details.box { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); }
details.box > summary { list-style: none; cursor: pointer; padding: 14px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
details.box > summary::-webkit-details-marker { display: none; }
details.box > summary::before { content: ""; width: 8px; height: 8px; border-right: 2px solid var(--dim); border-bottom: 2px solid var(--dim); transform: rotate(-45deg); transition: transform .15s; flex: none; }
details.box[open] > summary::before { transform: rotate(45deg); }
details.box > summary:hover { background: var(--panel-2); border-radius: var(--r); }
.box-body { padding: 0 16px 16px; }
.s-title { font-size: 15px; font-weight: 800; }
.day > summary .d-date { font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }
.day > summary .d-wd { color: var(--dim); font-weight: 700; text-transform: uppercase; font-size: 12px; letter-spacing: .08em; }
.day > summary .d-title { font-weight: 700; }
.day > summary .d-count { margin-left: auto; color: var(--faint); font-size: 12px; }
.badge { font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; background: var(--hw-soft); color: var(--hw); }
.day.today { border-color: var(--hw); }
.lead { color: var(--dim); margin: 0 0 12px; max-width: 80ch; }

.rows { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.r { display: grid; grid-template-columns: 96px minmax(0, 1fr) 200px 220px; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: start; }
.r .t { display: flex; flex-direction: column; gap: 2px; font-family: var(--mono); }
.r .t b { font-size: 13px; }
.r .t span { font-size: 12px; color: var(--faint); }
.r .main { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.act { font-weight: 700; }
.todo { color: var(--dim); font-size: 13px; }
.ans { align-self: flex-start; font-size: 12.5px; font-weight: 700; color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent); border-radius: 7px; padding: 2px 8px; }
.say { display: flex; gap: 8px; align-items: flex-start; background: var(--panel-2); border-radius: 9px; padding: 8px 10px; }
.say p { margin: 0; flex: 1; white-space: pre-wrap; word-break: break-word; font-size: 13px; }
.say small { display: block; color: var(--faint); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 2px; }
.cp { flex: none; background: none; border: 1px solid var(--line-strong); border-radius: 7px; padding: 3px 8px; font-size: 12px; font-weight: 700; color: var(--dim); }
.cp:hover { border-color: var(--brand); color: var(--brand); }
.prize { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; color: var(--dim); }
.code { display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; font-family: var(--mono); font-weight: 700; font-size: 13px; letter-spacing: .03em; color: var(--fg); background: var(--panel-2); border: 1px dashed var(--line-strong); border-radius: 7px; padding: 3px 8px; }
.code:hover { border-color: var(--brand); color: var(--brand); }
.code em { font-style: normal; font-family: var(--font); font-size: 11px; color: var(--faint); font-weight: 700; }
.pic img { width: 100%; height: auto; display: block; border-radius: 9px; border: 1px solid var(--line); }
.pic a { display: block; }
.note { color: var(--dim); font-size: 13px; margin: 12px 0 0; }

table.simple { width: 100%; border-collapse: collapse; font-size: 13px; }
table.simple th, table.simple td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.simple th { color: var(--faint); font-size: 12px; font-weight: 700; }
dl.rules { margin: 0; display: grid; grid-template-columns: 180px 1fr; gap: 8px 16px; }
dl.rules dt { font-weight: 700; }
dl.rules dd { margin: 0; color: var(--dim); }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 9px; font-weight: 700; font-size: 13px; z-index: 50; }

@media (max-width: 900px) {
  .r { grid-template-columns: 80px minmax(0, 1fr); }
  .r .prize, .r .pic { grid-column: 2; }
  .pic img { max-width: 360px; }
  dl.rules { grid-template-columns: 1fr; gap: 2px; }
  dl.rules dd { margin-bottom: 8px; }
}
</style>

<div id="gate" class="gate gutter" hidden>
  <form id="gateForm">
    <h1>Haunted Week · саппорт</h1>
    <p>Введи ключ доступа (тот же, что для «Плана чатов»). Браузер его запомнит.</p>
    <input id="gateKey" type="password" autocomplete="current-password" placeholder="Ключ доступа">
    <button class="btn primary" type="submit">Открыть</button>
    <div id="gateErr" class="err"></div>
  </form>
</div>

<div id="app" hidden>
  <header class="top gutter"><div class="inner">
    <h1 class="title">🎃 Haunted Week · чат Scarlet Sands</h1>
    <span class="sub">26.10 → 01.11 · план для саппорта</span>
    <span class="spacer"></span>
    <button class="btn" id="todayBtn" type="button">Сегодня</button>
    <button class="btn" id="allBtn" type="button">Развернуть всё</button>
  </div></header>
  <div class="gutter"><div class="inner"><main id="main"></main></div></div>
</div>
<div id="toast" class="toast" hidden></div>

<script>
(function () {
  "use strict";
  var EMBED = null;
  var DATA_URL = "./data.enc.json";
  var LS_KEY = "planhub.key";
  var $ = function (id) { return document.getElementById(id); };

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function toast(msg) { var t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(function () { t.hidden = true; }, 1600); }
  function copy(text, what) {
    function fallback() {
      var ta = document.createElement("textarea"); ta.value = text; ta.style.cssText = "position:fixed;opacity:0;top:0";
      document.body.appendChild(ta); ta.select(); var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta); toast(ok ? "Скопировано: " + what : "Не удалось скопировать");
    }
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(function () { toast("Скопировано: " + what); }, fallback);
    else fallback();
  }

  // ---------- расшифровка (формат automation/build-plan-hub.js) ----------
  function b64(s) { var bin = atob(s), u = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
  function decrypt(enc, pass) {
    var subtle = crypto.subtle;
    return subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"])
      .then(function (base) { return subtle.deriveKey({ name: "PBKDF2", salt: b64(enc.salt), iterations: enc.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]); })
      .then(function (k) { return subtle.decrypt({ name: "AES-GCM", iv: b64(enc.iv) }, k, b64(enc.ct)); })
      .then(function (buf) { return JSON.parse(new TextDecoder().decode(buf)); });
  }
  function load(pass) {
    return fetch(DATA_URL + "?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("Не удалось загрузить данные: HTTP " + r.status); return r.json(); })
      .then(function (enc) { return decrypt(enc, pass).catch(function () { throw new Error("Ключ не подходит"); }); });
  }
  function showGate(err) { $("app").hidden = true; $("gate").hidden = false; $("gateErr").textContent = err || ""; $("gateKey").focus(); }
  $("gateForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var v = $("gateKey").value.trim(); if (!v) return;
    $("gateErr").textContent = "Открываю…";
    load(v).then(function (d) { lsSet(LS_KEY, v); start(d); }, function (er) { $("gateErr").textContent = er.message; });
  });

  // день чата = день в США по ET
  function todayET() { return new Date().toLocaleDateString("sv-SE", { timeZone: "America/New_York" }); }

  // ---------- рендер ----------
  function rowHtml(r) {
    var say = (r.say || []).map(function (s) {
      return '<div class="say"><p>' + (s.l ? "<small>" + esc(s.l) + "</small>" : "") + esc(s.t) + '</p><button class="cp" type="button" data-copy="' + esc(s.t) + '" data-what="текст">Копировать</button></div>';
    }).join("");
    var codes = (r.codes || []).map(function (c) {
      return '<button class="code" type="button" data-copy="' + esc(c[1]) + '" data-what="код" title="Скопировать код">' + (c[0] ? "<em>" + esc(c[0]) + "</em>" : "") + esc(c[1]) + "</button>";
    }).join("");
    var pic = r.src ? '<div class="pic"><a href="' + esc(r.src) + '" target="_blank" rel="noopener" title="Открыть в полном размере"><img src="' + esc(r.src) + '" alt="' + esc(r.act) + '" loading="lazy"></a></div>' : '<div class="pic"></div>';
    return '<div class="r">' +
      '<div class="t"><b>' + esc(r.et) + "</b><span>Киев " + esc(r.kyiv) + "</span></div>" +
      '<div class="main"><div class="act">' + esc(r.act) + "</div>" +
        (r.ans ? '<span class="ans">Ответ: ' + esc(r.ans) + "</span>" : "") +
        (r.todo ? '<div class="todo">' + esc(r.todo) + "</div>" : "") + say + "</div>" +
      '<div class="prize">' + (r.prize ? "<span>" + esc(r.prize) + "</span>" : "") + codes + "</div>" +
      pic + "</div>";
  }

  function start(D) {
    $("gate").hidden = true; $("app").hidden = false;
    var today = todayET(), h = [];
    h.push('<details class="box"><summary><span class="s-title">Как пользоваться</span></summary><div class="box-body"><dl class="rules">' +
      D.rules.map(function (x) { return "<dt>" + esc(x[0]) + "</dt><dd>" + esc(x[1]) + "</dd>"; }).join("") + "</dl></div></details>");
    h.push('<details class="box"><summary><span class="s-title">Каждый вечер: квизы и Witching Hour</span></summary><div class="box-body"><table class="simple"><thead><tr><th>Время ET</th><th>Что</th><th>Что нужно от саппорта</th></tr></thead><tbody>' +
      D.nightly.map(function (x) { return "<tr><td>" + esc(x[0]) + "</td><td>" + esc(x[1]) + "</td><td>" + esc(x[2]) + "</td></tr>"; }).join("") + "</tbody></table></div></details>");
    D.days.forEach(function (d) {
      var isToday = d.date === today, n = d.rows.reduce(function (s, r) { return s + (r.codes || []).length; }, 0);
      h.push('<details class="box day' + (isToday ? " today" : "") + '" id="d-' + d.date + '"' + (isToday ? " open" : "") + '><summary>' +
        '<span class="d-date">' + d.date.slice(8, 10) + "." + d.date.slice(5, 7) + '</span><span class="d-wd">' + esc(d.wd) + '</span><span class="d-title">' + esc(d.title) + "</span>" +
        (isToday ? '<span class="badge">сегодня</span>' : "") + '<span class="d-count">' + d.rows.length + " пунктов · " + n + " кодов</span></summary>" +
        '<div class="box-body"><p class="lead">' + esc(d.lead) + '</p><div class="rows">' + d.rows.map(rowHtml).join("") + "</div>" +
        (d.note ? '<p class="note">' + esc(d.note) + "</p>" : "") + "</div></details>");
    });
    h.push('<details class="box"><summary><span class="s-title">Если что-то пошло не так</span></summary><div class="box-body"><table class="simple"><thead><tr><th>Ситуация</th><th>Что делать</th></tr></thead><tbody>' +
      D.trouble.map(function (x) { return "<tr><td>" + esc(x[0]) + "</td><td>" + esc(x[1]) + "</td></tr>"; }).join("") + "</tbody></table></div></details>");
    h.push('<details class="box"><summary><span class="s-title">Загадки в запас (Trick и осколок 3)</span></summary><div class="box-body"><p class="lead">Каждую загадку даём один раз за неделю: до 3 на Trick и 2 на сундуки.</p><table class="simple"><thead><tr><th>Загадка</th><th>Ответ</th><th></th></tr></thead><tbody>' +
      D.riddles.map(function (x) { return "<tr><td>" + esc(x[0]) + "</td><td>" + esc(x[1]) + '</td><td><button class="cp" type="button" data-copy="' + esc(x[0]) + '" data-what="загадка">Копировать</button></td></tr>'; }).join("") + "</tbody></table></div></details>");
    $("main").innerHTML = h.join("");

    $("main").addEventListener("click", function (e) { var c = e.target.closest("[data-copy]"); if (c) copy(c.dataset.copy, c.dataset.what); });
    $("todayBtn").addEventListener("click", function () {
      var el = $("d-" + todayET());
      if (!el) { toast("Сегодня не день Haunted Week"); return; }
      el.open = true; el.scrollIntoView({ block: "start" });
    });
    $("allBtn").addEventListener("click", function () {
      var all = [].slice.call(document.querySelectorAll("details.box")), open = !all.every(function (x) { return x.open; });
      all.forEach(function (x) { x.open = open; });
      this.textContent = open ? "Свернуть всё" : "Развернуть всё";
    });
    var t = $("d-" + today); if (t) setTimeout(function () { t.scrollIntoView({ block: "start" }); }, 50);
  }

  if (EMBED) { start(EMBED); return; }
  var m = location.hash.match(/key=([^&]+)/);
  if (m) { lsSet(LS_KEY, decodeURIComponent(m[1])); history.replaceState(null, "", location.pathname); }
  var saved = lsGet(LS_KEY);
  if (!saved) { showGate(); return; }
  load(saved).then(start, function (er) { lsSet(LS_KEY, null); showGate(er.message); });
})();
</script>

<script src="../common/nav.js" defer></script>
</body>
</html>
