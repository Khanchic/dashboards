<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dashboards</title>
<style>
  :root{
    --bg:#f4f5f3; --surface:#ffffff; --surface-2:#eceeec; --border:#d7dad6;
    --text:#1c1f1d; --text-dim:#666b66; --text-faint:#9a9f9a;
    --accent:#b8842e; --accent-text:#5f4413; --accent-soft:rgba(184,132,46,0.14);
    --shadow: 0 1px 2px rgba(20,22,20,0.06), 0 8px 24px -12px rgba(20,22,20,0.18);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0d0f0e; --surface:#161917; --surface-2:#1e2220; --border:#2b302d;
      --text:#e9ebe8; --text-dim:#a4a9a3; --text-faint:#6f746f;
      --accent:#d4a24e; --accent-text:#f0d29a; --accent-soft:rgba(212,162,78,0.16);
      --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 12px 32px -16px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0d0f0e; --surface:#161917; --surface-2:#1e2220; --border:#2b302d;
    --text:#e9ebe8; --text-dim:#a4a9a3; --text-faint:#6f746f;
    --accent:#d4a24e; --accent-text:#f0d29a; --accent-soft:rgba(212,162,78,0.16);
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 12px 32px -16px rgba(0,0,0,0.6);
  }
  :root[data-theme="light"]{
    --bg:#f4f5f3; --surface:#ffffff; --surface-2:#eceeec; --border:#d7dad6;
    --text:#1c1f1d; --text-dim:#666b66; --text-faint:#9a9f9a;
    --accent:#b8842e; --accent-text:#5f4413; --accent-soft:rgba(184,132,46,0.14);
    --shadow: 0 1px 2px rgba(20,22,20,0.06), 0 8px 24px -12px rgba(20,22,20,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.45;
  }
  .wrap{ max-width:920px; margin:0 auto; padding:56px 20px 64px; }
  .eyebrow{
    text-transform:uppercase; letter-spacing:.09em; font-size:11.5px;
    font-weight:600; color:var(--text-faint); margin-bottom:8px;
  }
  h1{ margin:0 0 8px; font-size:30px; font-weight:650; letter-spacing:-0.01em; text-wrap:balance; }
  .sub{ color:var(--text-dim); font-size:14.5px; max-width:60ch; margin-bottom:36px; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; }
  a.card{
    display:block; background:var(--surface); border:1px solid var(--border);
    border-radius:12px; padding:18px 18px 16px; text-decoration:none; color:inherit;
    transition:border-color .12s ease, transform .12s ease, box-shadow .12s ease;
  }
  a.card:hover{ border-color:var(--accent); transform:translateY(-1px); box-shadow:var(--shadow); }
  .tag{
    display:inline-block; font-size:11px; font-weight:650; letter-spacing:.03em;
    text-transform:uppercase; color:var(--accent-text); background:var(--accent-soft);
    padding:3px 8px; border-radius:99px; margin-bottom:10px;
  }
  .card h2{ margin:0 0 6px; font-size:16.5px; font-weight:650; letter-spacing:-0.005em; }
  .card p{ margin:0 0 10px; font-size:13px; color:var(--text-dim); }
  .card .meta{ font-size:11.5px; color:var(--text-faint); font-variant-numeric:tabular-nums; }
  .empty{
    border:1px dashed var(--border); border-radius:12px; padding:28px;
    text-align:center; color:var(--text-faint); font-size:13.5px;
  }
  footer{ margin-top:40px; font-size:12px; color:var(--text-faint); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">Live dashboards</div>
    <h1>Dashboards</h1>
    <div class="sub">Data views published straight from Claude Code skills. Each card is a self-contained page — open it, the numbers are current as of the last publish.</div>

    <div class="grid" id="grid"></div>
    <footer>Updated automatically whenever a dashboard is republished.</footer>
  </div>

<script type="application/json" id="registry">
[
  {"tag":"Poll","title":"Why users keep coming back","desc":"309 respondents, 528 selections — filterable by option, with custom answers surfaced.","path":"poll-breakdown/","date":"2026-07-28"}
]
</script>
<script>
  const items = JSON.parse(document.getElementById('registry').textContent);
  const grid = document.getElementById('grid');
  if(items.length === 0){
    grid.innerHTML = '<div class="empty">No dashboards published yet.</div>';
  } else {
    grid.innerHTML = items.map(i => `
      <a class="card" href="${i.path}">
        <span class="tag">${i.tag}</span>
        <h2>${i.title}</h2>
        <p>${i.desc}</p>
        <div class="meta">Published ${i.date}</div>
      </a>
    `).join('');
  }
</script>
</body>
</html>
