  const periodLabel = () => span === 1 ? LBL[W[0]]
    : `${LBL[W[span - 1]].split("–")[0]}–${LBL[W[0]].split("–")[1] || LBL[W[0]]}`;
  const spanName = n => n === 1 ? "1 тиждень" : (n === MAXW ? `усі ${n}` : `${n} тижні`);

  el("eyebrow").textContent = D.eyebrow;
  el("h1").innerHTML = D.h1;
  el("standfirst").innerHTML = D.standfirst;
  el("meta").innerHTML = D.meta.map(m => `<span>${m}</span>`).join("");
  el("caveats").innerHTML = D.caveats.map(p => `<p>${p}</p>`).join("");

  // ---- shared chart builders ---------------------------------------------
  function bars(title, cap, vals, fmtV) {
    const w = 260, h = 116, padB = 20, gap = 8;
    const max = Math.max(...vals) * 1.18 || 1;
    const bw = (w - gap * (vals.length - 1)) / vals.length;
    let s = `<svg viewBox="0 0 ${w} ${h + padB}" role="img" aria-label="${title}">`;
    s += `<line class="grid-line" x1="0" y1="${h}" x2="${w}" y2="${h}"></line>`;
    vals.forEach((v, i) => {
      const bh = Math.max(2, (v / max) * (h - 18)), x = i * (bw + gap), y = h - bh;
      s += `<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="4" ry="4"
             style="fill:var(--accent)" opacity="${i === 0 ? 1 : 0.42}"><title>${LBL[W[i]]}: ${fmtV(v)}</title></rect>`;
      s += `<text class="vlab${i === 0 ? " lead" : ""}" x="${x + bw / 2}" y="${y - 5}" text-anchor="middle">${fmtV(v)}</text>`;
      s += `<text class="tick" x="${x + bw / 2}" y="${h + 13}" text-anchor="middle">${wk(W[i])}</text>`;
    });
    return `<div class="panel mini"><h3>${title}</h3><div class="cap">${cap}</div>${s}</svg></div>`;
  }

  function deltaHTML(now, prev, money, vs) {
    const d = now - prev, r = prev ? d / prev : 0;
    return `<span class="delta ${d >= 0 ? "up" : "down"}">${d >= 0 ? "+" : "−"}${pct(Math.abs(r))}</span> проти `
         + (money ? usd(prev) : fmt(prev)) + " " + (vs || "тижнем раніше");
  }

  // ---- overview -----------------------------------------------------------
  function renderOverview() {
    const last = 0, prev = 1;
    const totDep = D.pool[last], totDepPrev = D.pool[prev];
    const totOc = D.projects.reduce((a, p) => a + p.totals.oc[last], 0);
    const totOcPrev = D.projects.reduce((a, p) => a + p.totals.oc[prev], 0);
    const totGive = D.projects.reduce((a, p) => a + p.totals.give[last], 0);
    const ranked = D.projects.slice().sort((a, b) => b.totals.dep[last] - a.totals.dep[last]);
    const grown = D.projects.slice().sort((a, b) =>
      (b.totals.dep[last] / b.totals.dep[W.length - 1]) - (a.totals.dep[last] / a.totals.dep[W.length - 1]));

    let h = "";

    h += `<section><h2>Усі проєкти · тиждень ${LBL[W[0]]}</h2><div class="kpis">` + [
      ["Депозит із SMM-оферів", usd(totDep), deltaHTML(totDep, totDepPrev, true)],
      ["Куплено оферів", fmt(totOc), deltaHTML(totOc, totOcPrev, false)],
      ["Free money віддано", usd(totGive), `<span class="delta">${pct(totGive / totDep)}</span> від депозиту тижня`],
      ["Найбільший бренд", ranked[0].label, `${usd(ranked[0].totals.dep[last])} · ${pct(ranked[0].totals.dep[last] / totDep)} пулу`],
      ["Найшвидший ріст", grown[0].label, `×${(grown[0].totals.dep[last] / grown[0].totals.dep[W.length - 1]).toFixed(1).replace(".", ",")} за ${W.length} тижнів`],
    ].map(([l, v, s]) => `<div class="kpi"><div class="label">${l}</div>
        <div class="value" style="font-size:${v.length > 9 ? "22px" : "30px"}">${v}</div>
        <div class="sub">${s}</div></div>`).join("") + `</div></section>`;

    // ranked bars, W31 with the previous week as a ghost behind it
    const w = 900, rowH = 30, padL = 132, padR = 96;
    const max = Math.max(...ranked.map(p => p.totals.dep[last])) * 1.02;
    let s = `<svg viewBox="0 0 ${w} ${ranked.length * rowH + 8}" role="img"
      aria-label="Депозит по проєктах за останній тиждень">`;
    ranked.forEach((p, i) => {
      const y = i * rowH + 4, avail = w - padL - padR;
      const bw = (p.totals.dep[last] / max) * avail;
      const gw = (p.totals.dep[prev] / max) * avail;
      s += `<text class="vlab lead" x="${padL - 10}" y="${y + 15}" text-anchor="end">${p.label}</text>`;
      s += `<rect x="${padL}" y="${y + 3}" width="${Math.max(1, gw)}" height="18" rx="3" ry="3"
             style="fill:var(--rule-strong)"><title>${p.label} · ${LBL[W[prev]]}: ${usd(p.totals.dep[prev])}</title></rect>`;
      s += `<rect x="${padL}" y="${y + 6}" width="${Math.max(1, bw)}" height="12" rx="3" ry="3"
             style="fill:var(--accent)"><title>${p.label} · ${LBL[W[last]]}: ${usd(p.totals.dep[last])}</title></rect>`;
      s += `<text class="vlab lead" x="${padL + Math.max(gw, bw) + 8}" y="${y + 15}">${usd(p.totals.dep[last])}</text>`;
    });
    s += "</svg>";
    h += `<section><h2>Хто скільки приносить</h2><div class="panel">${s}
      <div class="legend"><span><span class="sw" style="background:var(--accent)"></span>${LBL[W[last]]}</span>
      <span><span class="sw" style="background:var(--rule-strong)"></span>${LBL[W[prev]]}</span></div>
      <p class="note" style="margin-top:12px">${D.overview_chart_note || ""}</p></div></section>`;

    // comparison table
    let t = `<thead><tr><th>Проєкт</th>` + W.map(x => `<th>${wk(x)}</th>`).join("")
      + `<th>Ріст ×</th><th>Ср. чек</th><th>Free money</th></tr></thead><tbody>`;
    ranked.forEach(p => {
      const g = p.totals.dep[last] / p.totals.dep[W.length - 1];
      t += `<tr><td><button class="jump" data-go="${p.project}">${p.label}</button></td>`
        + W.map((_, i) => `<td class="${i === 0 ? "now" : ""}">${usd(p.totals.dep[i])}</td>`).join("")
        + `<td style="color:${g >= 1 ? "var(--good)" : "var(--bad)"}">×${g.toFixed(1).replace(".", ",")}</td>`
        + `<td>${money2(p.totals.avg[last])}</td>`
        + `<td>${pct(p.totals.give[last] / p.totals.dep[last])}</td></tr>`;
    });
    t += `</tbody><tfoot><tr><td>Разом</td>`
      + W.map((_, i) => `<td>${usd(D.pool[i])}</td>`).join("")
      + `<td>×${(D.pool[0] / D.pool[W.length - 1]).toFixed(1).replace(".", ",")}</td><td></td><td></td></tr></tfoot>`;
    h += `<section><h2>Порівняння · депозит по тижнях</h2>
      <div class="panel tablewrap"><table>${t}</table></div>
      <p class="note">Натисни на назву бренду, щоб відкрити його розбір.</p></section>`;

    h += `<section><h2>Як це читати</h2><ul class="reads">`
      + D.overview_reads.map((r, i) => `<li><span class="k">${String(i + 1).padStart(2, "0")}</span><p>${r}</p></li>`).join("")
      + `</ul></section>`;
    return h;
  }

  // ---- one project --------------------------------------------------------
  function renderProject(p) {
    const T = p.totals;
    let h = "";

    // Everything in this block is aggregated over the chosen period, and compared
    // with the period of the same length immediately before it. When there is no
    // such period left in the store the comparison is dropped rather than made
    // against a shorter one, which would read as a collapse.
    const dep = sum(T.dep, 0, span), oc = sum(T.oc, 0, span), give = sum(T.give, 0, span);
    const pdep = sum(T.dep, span, span), poc = sum(T.oc, span, span);
    const avg = oc ? dep / oc : 0, pavg = poc ? pdep / poc : 0;
    const uuPeak = peak(T.uu, 0, span);
    const cmp = hasPrev();
    const vs = span === 1 ? "тижнем раніше" : `попередніми ${span === MAXW ? span : span} тижнями`;
    const dlt = (now, prev, money) => cmp ? deltaHTML(now, prev, money, vs) : `<span class="delta">за ${spanName(span)}</span>`;

    h += `<section><h2>${p.label} · ${periodLabel()}</h2><div class="kpis">` + [
      ["Депозит із SMM-оферів", usd(dep), dlt(dep, pdep, true)],
      ["Куплено оферів", fmt(oc), dlt(oc, poc, false)],
      [span === 1 ? "Унікальні покупці" : "Унікальні · найкращий тиждень",
       fmt(uuPeak),
       span === 1 ? dlt(T.uu[0], T.uu[1], false)
                  : `<span class="delta">не сумується</span> за період — гравець рахується щотижня`],
      ["Середній чек", money2(avg), dlt(avg, pavg, false)],
      ["Free money віддано", usd(give), `<span class="delta">${pct(dep ? give / dep : 0)}</span> від депозиту періоду`],
    ].map(([l, v, s]) => `<div class="kpi"><div class="label">${l}</div>
        <div class="value">${v}</div><div class="sub">${s}</div></div>`).join("")
      + `</div>${p.standfirst ? `<p class="note">${p.standfirst}</p>` : ""}</section>`;

    h += `<section><h2>Динаміка · ${W.length} тижнів</h2><div class="panel"><div class="grid-4">`
      + bars("Депозит", "сума покупок оферів, $", T.dep, usd)
      + bars("Куплено оферів", "штук за тиждень", T.oc, fmt)
      + bars("Унікальні покупці", "distinct-гравці", T.uu, fmt)
      + bars("Середній чек", "депозит ÷ покупки", T.avg, money2)
      + `</div><p class="note" style="margin-top:14px">${D.trend_note}</p></div></section>`;

    // channels
    const CH = p.channels;
    const w = 900, ch = 230, padB = 26, padT = 22, gap = 26;
    const tot = W.map((_, i) => CH.reduce((a, c) => a + c.dep[i], 0));
    const max = Math.max(...tot) * 1.1 || 1;
    const bw = (w - gap * (W.length - 1)) / W.length;
    let s = `<svg viewBox="0 0 ${w} ${ch + padB + padT}" role="img" aria-label="Депозит по каналах">`;
    for (let g = 0; g <= 4; g++) {
      const y = padT + (ch - (g / 4) * ch);
      s += `<line class="grid-line" x1="0" y1="${y}" x2="${w}" y2="${y}"></line>`;
      s += `<text class="tick" x="${w + 6}" y="${y + 3}">${g ? "$" + fmt((max * g) / 4) : "0"}</text>`;
    }
    W.forEach((x, i) => {
      let acc = 0; const px = i * (bw + gap);
      CH.forEach(c => {
        const v = c.dep[i]; if (!v) return;
        const bh = (v / max) * ch, y = padT + ch - (acc / max) * ch - bh;
        s += `<rect x="${px}" y="${y}" width="${bw}" height="${Math.max(0, bh - 2)}" rx="3" ry="3"
               style="fill:var(--${c.slot})" opacity="${i === 0 ? 1 : 0.55}"><title>${LBL[x]} · ${c.n}: ${usd(v)} (${c.oc[i]} покупок)</title></rect>`;
        acc += v;
      });
      s += `<text class="vlab lead" x="${px + bw / 2}" y="${padT + ch - (acc / max) * ch - 8}" text-anchor="middle">${usd(acc)}</text>`;
      s += `<text class="tick" x="${px + bw / 2}" y="${padT + ch + 16}" text-anchor="middle">${wk(x)}</text>`;
      s += `<text class="tick" x="${px + bw / 2}" y="${padT + ch + 28}" text-anchor="middle">${LBL[x]}</text>`;
    });
    s += "</svg>";

    // Week columns stay per week — that is the trend. The two summary columns on
    // the right follow the chosen period instead of the newest week.
    let ct = `<thead><tr><th>Канал</th>` + W.map(x => `<th>${wk(x)}</th>`).join("")
      + `<th>Куплено за період</th><th>Ср. чек</th></tr></thead><tbody>`;
    CH.forEach(c => {
      const coc = sum(c.oc, 0, span), cdep = sum(c.dep, 0, span);
      ct += `<tr><td><span class="chip" style="background:var(--${c.slot})"></span>${c.n}</td>`
        + W.map((_, i) => `<td class="${i < span ? "now" : ""}">${c.dep[i] ? usd(c.dep[i]) : "—"}</td>`).join("")
        + `<td>${coc || "—"}</td><td>${coc ? money2(cdep / coc) : "—"}</td></tr>`;
    });
    ct += `</tbody><tfoot><tr><td>Разом</td>` + tot.map(v => `<td>${usd(v)}</td>`).join("")
      + `<td>${fmt(oc)}</td><td>${money2(avg)}</td></tr></tfoot>`;

    h += `<section><h2>Канали · звідки приходить депозит</h2>
      <div class="panel">${s}<div class="legend">`
      + CH.map(c => `<span><span class="sw" style="background:var(--${c.slot})"></span>${c.n}</span>`).join("")
      + `</div></div><div class="panel tablewrap"><table>${ct}</table></div></section>`;

    // segments
    const SEG = p.segments;
    const smax = Math.max(...SEG.flatMap(r => r.oc)) || 1;
    let st = `<thead><tr><th>Сегмент</th>` + W.map(x => `<th>${wk(x)}</th>`).join("")
      + `<th>Депозит за період</th><th>Ср. чек</th></tr></thead><tbody>`;
    SEG.forEach(r => {
      const sdep = sum(r.dep, 0, span), soc = sum(r.oc, 0, span);
      st += `<tr><td>${r.n}</td>` + r.oc.map(v => {
        const a = v ? 0.10 + 0.55 * (v / smax) : 0;
        return `<td class="cell">${v ? `<i style="opacity:${a.toFixed(3)}"></i>` : ""}<span>${v || "—"}</span></td>`;
      }).join("")
      + `<td class="now">${sdep ? usd(sdep) : "—"}</td>`
      + `<td>${soc ? money2(sdep / soc) : "—"}</td></tr>`;
    });
    st += `</tbody><tfoot><tr><td>Разом куплено</td>`
      + W.map((_, i) => `<td>${fmt(SEG.reduce((a, r) => a + r.oc[i], 0))}</td>`).join("")
      + `<td>${usd(dep)}</td><td>${money2(avg)}</td></tr></tfoot>`;

    // warm / cold
    const WC = p.warm_cold;
    const ww = 260, wh = 110, wpadB = 20, wgap = 14, bg = 3;
    const wmax = Math.max(...WC.warm, 1) * 1.2;
    const slot = (ww - wgap * (W.length - 1)) / W.length, wbw = (slot - bg) / 2;
    let ws = `<svg viewBox="0 0 ${ww} ${wh + wpadB}" role="img" aria-label="Теплі проти холодних">`;
    ws += `<line class="grid-line" x1="0" y1="${wh}" x2="${ww}" y2="${wh}"></line>`;
    W.forEach((x, i) => {
      const px = i * (slot + wgap);
      [["warm", "s1"], ["cold", "s2"]].forEach(([k, sl], j) => {
        const v = WC[k][i], bh = Math.max(2, (v / wmax) * (wh - 14));
        ws += `<rect x="${px + j * (wbw + bg)}" y="${wh - bh}" width="${wbw}" height="${bh}" rx="3" ry="3"
                style="fill:var(--${sl})" opacity="${i === 0 ? 1 : 0.45}"><title>${LBL[x]} · ${k === "warm" ? "7d−" : "7d+"}: ${v}</title></rect>`;
      });
      ws += `<text class="vlab${i === 0 ? " lead" : ""}" x="${px + slot / 2}" y="${wh - (WC.warm[i] / wmax) * (wh - 14) - 5}"
              text-anchor="middle">${WC.warm[i]}/${WC.cold[i]}</text>`;
      ws += `<text class="tick" x="${px + slot / 2}" y="${wh + 13}" text-anchor="middle">${wk(x)}</text>`;
    });
    ws += "</svg>";

    h += `<section><h2>Сегменти · кому продаємо</h2>
      <div class="panel tablewrap"><table class="heat">${st}</table></div>
      <div class="grid-4">
        <div class="panel mini"><h3>Теплі проти холодних</h3>
          <div class="cap">куплено оферів, тільки «драбинкові» сегменти</div>${ws}
          <div class="legend"><span><span class="sw" style="background:var(--s1)"></span>7d− теплі</span>
          <span><span class="sw" style="background:var(--s2)"></span>7d+ холодні</span></div></div>
        <div class="panel mini" style="grid-column:span 2"><h3>Що означає сегмент</h3>
          <div class="cap">пара (ціна, free money) однозначно задає аудиторію</div>
          <p class="note" style="font-size:12.5px">Драбина йде по середньому депозиту за 30 днів
          (≤20 / 20–40 / &gt;40) і по давності останнього депозиту: <strong>7d−</strong> — купував
          протягом тижня, <strong>7d+</strong> — давніше. Холодному гравцю свідомо дають
          <em>дешевший</em> офер із <em>більшим</em> free money. <code>D0</code> — жодної покупки
          за весь час, <code>inout&lt;-10</code> — гравець у плюсі.</p></div>
      </div></section>`;

    // movers
    const mrow = m => `<div class="mrow"><span class="nm">${esc(m.n)}<small>${esc(m.sub)}</small></span>
      <span class="num">${m.a}→${m.b}</span>
      <span class="d" style="color:${m.d >= 0 ? "var(--good)" : "var(--bad)"}">${m.d >= 0 ? "+" : "−"}${Math.abs(m.d)}</span></div>`;
    // Movers are recomputed for the chosen period rather than read from the
    // payload's one-week version, so "4 weeks" compares four against four.
    let mUp = p.movers_up, mDown = p.movers_down, mNew = p.new_offers, mGone = p.gone_offers;
    let mTitle = `Рухи тижня · ${wk(W[1])} → ${wk(W[0])}`;
    if (p.offers && cmp) {
      const rowsM = p.offers.map(o => {
        const b = sum(o.oc, 0, span), a = sum(o.oc, span, span);
        const bd = sum(o.dep, 0, span), ad = sum(o.dep, span, span);
        return { n: o.n, sub: o.sub, a: a, b: b, d: b - a, bd: bd, ad: ad };
      });
      mUp = rowsM.filter(r => r.d > 0).sort((x, y) => y.d - x.d).slice(0, 8);
      mDown = rowsM.filter(r => r.d < 0).sort((x, y) => x.d - y.d).slice(0, 8);
      mNew = rowsM.filter(r => r.bd > 0 && r.ad === 0).map(r => r.n);
      mGone = rowsM.filter(r => r.bd === 0 && r.ad > 0).map(r => r.n);
      mTitle = span === 1
        ? `Рухи тижня · ${wk(W[1])} → ${wk(W[0])}`
        : `Рухи періоду · попередні ${span} тижні → ${periodLabel()}`;
    }
    if (mUp.length || mDown.length) {
      h += `<section><h2>${mTitle}</h2><div class="movers">
        <div class="panel"><div class="eyebrow" style="margin-bottom:10px">Зростання</div>
          <div class="mlist">${mUp.map(mrow).join("") || '<p class="note">нічого помітного</p>'}</div></div>
        <div class="panel"><div class="eyebrow" style="margin-bottom:10px">Падіння</div>
          <div class="mlist">${mDown.map(mrow).join("") || '<p class="note">нічого помітного</p>'}</div></div>
      </div>`;
      const ng = [];
      if (mNew.length) ng.push(`<strong>З’явилось:</strong> ${mNew.map(esc).join(", ")}`);
      if (mGone.length) ng.push(`<strong>Зникло:</strong> ${mGone.map(esc).join(", ")}`);
      if (p.newgone) ng.push(p.newgone);
      if (ng.length) {
        h += `<div class="panel"><div class="eyebrow" style="margin-bottom:10px">Нове й зникле</div>
          <p class="note" style="margin:0">${ng.join("<br>")}</p></div>`;
      }
      h += `</section>`;
    }

    // share of the pool
    if (p.share) {
      const sw = 900, sh = 120, spadB = 30, spadT = 18, sgap = 26;
      const smaxv = Math.max(...p.share.all) * 1.08;
      const sbw = (sw - sgap * (W.length - 1)) / W.length;
      let ss = `<svg viewBox="0 0 ${sw} ${sh + spadB + spadT}" role="img" aria-label="Частка проєкту">`;
      W.forEach((x, i) => {
        const px = i * (sbw + sgap);
        const ah = (p.share.all[i] / smaxv) * sh, nh = (p.share.project[i] / smaxv) * sh;
        ss += `<rect x="${px}" y="${spadT + sh - ah}" width="${sbw}" height="${ah}" rx="3" ry="3"
                style="fill:var(--rule-strong)"><title>${LBL[x]} · усі бренди: ${usd(p.share.all[i])}</title></rect>`;
        ss += `<rect x="${px}" y="${spadT + sh - nh}" width="${sbw}" height="${nh}" rx="3" ry="3"
                style="fill:var(--accent)" opacity="${i === 0 ? 1 : 0.6}"><title>${LBL[x]} · ${p.label}: ${usd(p.share.project[i])}</title></rect>`;
        ss += `<text class="vlab lead" x="${px + sbw / 2}" y="${spadT + sh - ah - 6}" text-anchor="middle">${pct(p.share.project[i] / p.share.all[i])}</text>`;
        ss += `<text class="tick" x="${px + sbw / 2}" y="${spadT + sh + 14}" text-anchor="middle">${wk(x)}</text>`;
      });
      ss += "</svg>";
      h += `<section><h2>Частка ${p.label} у пулі</h2><div class="panel">${ss}
        <div class="legend"><span><span class="sw" style="background:var(--accent)"></span>${p.label}</span>
        <span><span class="sw" style="background:var(--rule-strong)"></span>усі бренди разом</span></div>
        </div></section>`;
    }

    // payouts — from the Deposit Number store, not the offers pass
    if (p.payouts) {
      const PO = p.payouts, PW = PO.weeks;
      const pmax = Math.max(...PW.map(x => x.ratio)) * 1.15 || 1;
      const pw = 900, ph = 150, ppadB = 30, ppadT = 20, pgap = 26;
      const pbw = (pw - pgap * (PW.length - 1)) / PW.length;
      let ps = `<svg viewBox="0 0 ${pw} ${ph + ppadB + ppadT}" role="img" aria-label="Виплати у % від депозиту">`;
      for (let g = 0; g <= 4; g++) {
        const y = ppadT + (ph - (g / 4) * ph);
        ps += `<line class="grid-line" x1="0" y1="${y}" x2="${pw}" y2="${y}"></line>`;
        ps += `<text class="tick" x="${pw + 6}" y="${y + 3}">${g ? pct((pmax * g) / 4) : "0"}</text>`;
      }
      PW.forEach((x, i) => {
        const px = i * (pbw + pgap);
        if (!x.has) {
          ps += `<text class="tick" x="${px + pbw / 2}" y="${ppadT + ph - 8}" text-anchor="middle">н/д</text>`;
        } else {
          const bh = (x.ratio / pmax) * ph;
          ps += `<rect x="${px}" y="${ppadT + ph - bh}" width="${pbw}" height="${Math.max(0, bh)}" rx="3" ry="3"
                  style="fill:var(${x.flagged ? "--bad" : "--rule-strong"})" opacity="${i === 0 ? 1 : 0.6}"
                  ><title>${LBL[x.week]} · виплати ${usd(x.pay)} від депозиту ${usd(x.dep)}</title></rect>`;
          ps += `<text class="vlab lead" x="${px + pbw / 2}" y="${ppadT + ph - bh - 6}" text-anchor="middle">${pct(x.ratio)}</text>`;
        }
        ps += `<text class="tick" x="${px + pbw / 2}" y="${ppadT + ph + 14}" text-anchor="middle">${wk(x.week)}</text>`;
      });
      ps += "</svg>";

      const prows = PW.map(x => `<tr><td>${LBL[x.week]}</td>
        <td class="num">${x.has ? usd(x.dep) : "—"}</td>
        <td class="num">${x.has ? usd(x.pay) : "—"}</td>
        <td class="num">${x.has ? pct(x.ratio) : "—"}</td>
        <td class="num">${x.has ? (x.flagged || "—") : "—"}</td>
        <td>${x.days.length ? x.days.join(", ") : "—"}</td></tr>`).join("");

      const plr = PO.players.length
        ? PO.players.map(x => `<tr><td><code>${esc(x.login)}</code></td>
            <td class="num">${pct(x.ratio)}</td><td class="num">${usd(x.dep)}</td>
            <td class="num">${x.deps}</td><td class="num lead">${usd(x.pay)}</td></tr>`).join("")
        : `<tr><td colspan="5" class="note">жодної виплати цього тижня</td></tr>`;

      const rep = PO.repeats.length
        ? PO.repeats.map(x => `<tr><td><code>${esc(x.login)}</code>${x.here ? ' <span class="delta">є й цього тижня</span>' : ""}</td>
            <td class="num">${x.n}</td><td>${x.weeks.join(", ")}</td>
            <td class="num lead">${usd(x.pay)}</td></tr>`).join("")
        : `<tr><td colspan="4" class="note">повторних логінів у накопиченій історії немає</td></tr>`;

      h += `<section><h2>Виплати · ${p.label}</h2><div class="panel">${ps}
        <p class="note" style="margin-top:12px">Стовпчик підсвічено, якщо того тижня звіт позначив
        хоча б одну клітинку <code>Payout&nbsp;after</code> своїм умовним форматуванням. Великі виплати
        для казино — норма: варіанс на малих ставках величезний, і великий виграш означає, що продукт
        працює. Дивитись варто на <em>гроші</em>, а не на відсоток.${PO.n_players ? ` Гравців із виплатою
        за ${LBL[W[0]]}: <strong>${PO.n_players}</strong>.` : ""}</p>
        <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Тиждень</th><th class="num">Депозит</th>
          <th class="num">Виплачено</th><th class="num">% від депозиту</th><th class="num">Підсвічено днів</th>
          <th>Які дні</th></tr></thead><tbody>${prows}</tbody></table></div>
        ${p.payout_note ? `<p class="note">${p.payout_note}</p>` : ""}
        </div>
        <div class="movers" style="margin-top:14px">
          <div class="panel"><div class="eyebrow" style="margin-bottom:10px">Найбільші виплати за ${LBL[W[0]]}</div>
            <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Логін</th><th class="num">%</th>
              <th class="num">База</th><th class="num">Деп.</th><th class="num">Виплата</th></tr></thead>
              <tbody>${plr}</tbody></table></div>
            <p class="note">Відсоток — це відношення, тому мала база дає величезний %. Порядок — за грошима.</p></div>
          <div class="panel"><div class="eyebrow" style="margin-bottom:10px">Логіни, що повторюються</div>
            <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Логін</th><th class="num">Тижнів</th>
              <th>Коли</th><th class="num">Разом</th></tr></thead><tbody>${rep}</tbody></table></div>
            <p class="note">Один великий виграш — варіанс. Той самий логін у кількох тижнях — це вже
            те, що варто перевірити в адмінці.</p></div>
        </div></section>`;
    }

    h += `<section><h2>Як це читати · ${p.label}</h2><ul class="reads">`
      + p.reads.map((r, i) => `<li><span class="k">${String(i + 1).padStart(2, "0")}</span><p>${r}</p></li>`).join("")
      + `</ul></section>`;
    return h;
  }

  // ---- switcher -----------------------------------------------------------
  let current = "__overview__";
  function show(key) {
    current = key;
    const p = D.projects.find(x => x.project === key);
    el("view").innerHTML = p ? renderProject(p) : renderOverview();
    Array.from(el("switcher").children).forEach(b => {
      if (b.dataset.key) b.setAttribute("aria-current", b.dataset.key === key ? "true" : "false");
    });
    el("view").querySelectorAll("button.jump").forEach(b =>
      b.addEventListener("click", () => { show(b.dataset.go); window.scrollTo({ top: 0 }); }));
    if (history.replaceState) history.replaceState(null, "", "#" + key);
  }

  // A single-brand page has nothing to switch between: the product manager who
  // opens it should see their brand, not a way into everyone else's numbers.
  // The period picker stays either way.
  const periodHTML = PERIODS.map(n =>
    `<button data-span="${n}"${n === span ? ' aria-current="true"' : ""}>${spanName(n)}</button>`).join("");

  el("switcher").innerHTML =
    (SINGLE ? "" :
      `<button data-key="__overview__">Огляд</button><span class="sep"></span>`
      + D.projects.slice()
          .sort((a, b) => b.totals.dep[0] - a.totals.dep[0])
          .map(p => `<button data-key="${p.project}">${p.label}</button>`).join("")
      + `<span class="sep"></span>`)
    + `<span class="pgroup">Період:</span>` + periodHTML;

  Array.from(el("switcher").children).forEach(b => {
    if (b.dataset.key) b.addEventListener("click", () => show(b.dataset.key));
    if (b.dataset.span) b.addEventListener("click", () => {
      span = Number(b.dataset.span);
      Array.from(el("switcher").children).forEach(x => {
        if (x.dataset.span) x.setAttribute("aria-current", Number(x.dataset.span) === span ? "true" : "false");
      });
      show(current);
    });
  });

  const fromHash = (location.hash || "").slice(1);
  if (SINGLE) show(D.projects[0].project);
  else show(D.projects.some(p => p.project === fromHash) || fromHash === "__overview__"
            ? fromHash : "__overview__");
})();
</script>
