<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="../common/nav.css">
</head>
<body>
<title>AI Weekly — Сводка и сборщик новостей</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #070a13; --panel: #0e1526; --panel-2: #121b30; --panel-3: #18233d;
  --line: rgba(255,255,255,.08); --line-strong: rgba(255,255,255,.16);
  --fg: #f0f4fc; --dim: #8f9dbb; --faint: #66748f;
  --brand: #00e5ff; --brand-soft: rgba(0,229,255,.12);
  --ok: #2fd59a; --ok-soft: rgba(47,213,154,.12);
  --warn: #ffc53d; --warn-soft: rgba(255,197,61,.13);
  --bad: #ff6b7a; --bad-soft: rgba(255,107,122,.13);
  --purple: #a58bff; --purple-soft: rgba(165,139,255,.14);
  --font: 'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
  --r: 12px; color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f3f6fb; --panel: #ffffff; --panel-2: #eef2f8; --panel-3: #e3e9f4;
    --line: rgba(10,25,60,.10); --line-strong: rgba(10,25,60,.2);
    --fg: #0d1830; --dim: #4a5874; --faint: #7c879d;
    --brand: #0090a8; --brand-soft: rgba(0,144,168,.10);
    --ok: #12825c; --ok-soft: rgba(18,130,92,.10);
    --warn: #9a6400; --warn-soft: rgba(196,128,0,.12);
    --bad: #c42c3d; --bad-soft: rgba(196,44,61,.10);
    --purple: #5b4fe0; --purple-soft: rgba(91,79,224,.10);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f3f6fb; --panel: #ffffff; --panel-2: #eef2f8; --panel-3: #e3e9f4;
  --line: rgba(10,25,60,.10); --line-strong: rgba(10,25,60,.2);
  --fg: #0d1830; --dim: #4a5874; --faint: #7c879d;
  --brand: #0090a8; --brand-soft: rgba(0,144,168,.10);
  --ok: #12825c; --ok-soft: rgba(18,130,92,.10);
  --warn: #9a6400; --warn-soft: rgba(196,128,0,.12);
  --bad: #c42c3d; --bad-soft: rgba(196,44,61,.10);
  --purple: #5b4fe0; --purple-soft: rgba(91,79,224,.10);
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--brand); text-decoration: none; }
a:hover { text-decoration: underline; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.inner { max-width: 1220px; margin: 0 auto; }

.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.top .inner { display: flex; flex-direction: column; gap: 10px; padding-block: 14px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.title { font-size: 20px; font-weight: 800; letter-spacing: -.01em; margin: 0; }
.meta { color: var(--faint); font-size: 12px; font-family: var(--mono); }
.spacer { flex: 1; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 14px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.kpi .v { font: 800 22px/1.2 var(--mono); color: var(--fg); }
.kpi .l { font-size: 12px; color: var(--dim); }

.tabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.tab-btn { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 7px 14px; font-weight: 700; font-size: 13px; color: var(--dim); }
.tab-btn[aria-selected="true"] { background: var(--brand-soft); border-color: var(--brand); color: var(--fg); }

.search { flex: 1 1 240px; min-width: 0; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 9px; padding: 8px 12px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips button { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; font-size: 12.5px; color: var(--dim); }
.chips button[aria-pressed="true"] { background: var(--brand-soft); border-color: var(--brand); color: var(--fg); font-weight: 600; }

.btn { background: var(--panel-2); border: 1px solid var(--line-strong); border-radius: 9px; padding: 7px 12px; font-size: 12.5px; font-weight: 700; color: var(--fg); display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--brand); }
.btn.primary { background: var(--brand); color: #04121a; border-color: var(--brand); }

main { padding-block: 16px 100px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 12px; }
@media (max-width: 480px) { .grid { grid-template-columns: 1fr; } }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 15px; display: flex; flex-direction: column; gap: 10px; border-top: 3px solid var(--c, var(--line-strong)); position: relative; }
.card.selected { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.b { font-size: 11.5px; font-weight: 700; border-radius: 999px; padding: 2px 8px; background: var(--panel-2); color: var(--dim); font-family: var(--mono); }
.b.score { background: var(--brand-soft); color: var(--brand); font-size: 12.5px; }
.b.confirmed { background: var(--ok-soft); color: var(--ok); }
.b.unconfirmed { background: var(--warn-soft); color: var(--warn); }
.b.t1 { background: var(--purple-soft); color: var(--purple); }
.b.kind { text-transform: uppercase; letter-spacing: .04em; }

.pick-label { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: var(--dim); cursor: pointer; user-select: none; background: var(--panel-2); padding: 4px 9px; border-radius: 8px; border: 1px solid var(--line); }
.pick-label input { accent-color: var(--brand); width: 15px; height: 15px; margin: 0; }
.t { font-size: 15.5px; font-weight: 700; margin: 0; line-height: 1.35; }
.t-ru { font-size: 14px; font-weight: 600; margin: 2px 0 0; line-height: 1.35; color: var(--brand); }
.sum { margin: 0; color: var(--dim); font-size: 13.5px; }
.sum-ru { margin: 4px 0 0; color: var(--fg); font-size: 13px; padding-left: 9px; border-left: 2px solid var(--line-strong); }
.sowhat { margin: 0; padding: 9px 11px; background: var(--panel-2); border-left: 3px solid var(--brand); border-radius: 6px; font-size: 13px; color: var(--fg); }
.sowhat b { color: var(--brand); }
.sowhat-ru { margin-top: 4px; color: var(--dim); font-size: 12.5px; }
.tags { display: flex; gap: 5px; flex-wrap: wrap; }
.tag { font-size: 11px; color: var(--faint); background: var(--panel-2); padding: 2px 7px; border-radius: 6px; font-family: var(--mono); }
.sources-list { display: flex; flex-direction: column; gap: 5px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 12.5px; }
.src-item { display: flex; align-items: baseline; gap: 6px; justify-content: space-between; }
.src-item a { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.src-meta { color: var(--faint); font-size: 11px; font-family: var(--mono); flex: none; }

table.tbl { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; font-size: 13px; }
.tbl th, .tbl td { padding: 9px 12px; text-align: left; border-bottom: 1px solid var(--line); }
.tbl th { background: var(--panel-2); color: var(--dim); font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.tbl tr:hover td { background: var(--panel-2); }

.tray { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: color-mix(in srgb, var(--panel) 95%, transparent); backdrop-filter: blur(12px); border-top: 1px solid var(--brand); padding: 12px 16px; box-shadow: 0 -8px 30px rgba(0,0,0,.4); }
.tray .inner { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; bottom: 80px; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 9px; font-size: 13px; font-weight: 700; z-index: 60; }
.issue-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; margin-bottom: 14px; }
.issue-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 12px; }
@media (max-width: 820px) { .issue-cols { grid-template-columns: 1fr; } }
.issue-col { display: flex; flex-direction: column; min-width: 0; }
.issue-col-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 11px; background: var(--panel-3); border: 1px solid var(--line); border-bottom: none; border-radius: 9px 9px 0 0; font-size: 12px; font-weight: 700; color: var(--dim); }
.issue-col-head .lang-tag { color: var(--fg); display: inline-flex; align-items: center; gap: 6px; }
.issue-col-head .copy-mini { background: var(--panel-2); border: 1px solid var(--line-strong); border-radius: 6px; padding: 3px 9px; font-size: 11.5px; font-weight: 700; color: var(--fg); }
.issue-col-head .copy-mini:hover { border-color: var(--brand); }
.issue-card pre { white-space: pre-wrap; word-wrap: break-word; font: 13.5px/1.55 var(--font); background: var(--panel-2); padding: 14px; border-radius: 0 0 9px 9px; border: 1px solid var(--line); margin: 0; flex: 1; }
.issue-card pre.ru-pre { border-color: rgba(0,229,255,.22); }
</style>

<header class="top gutter">
  <div class="inner">
    <div class="row">
      <h1 class="title">📰 AI Weekly — Фоновый агент и сводка</h1>
      <span class="meta" id="syncMeta">Загрузка…</span>
      <span class="spacer"></span>
      <button class="btn" id="btnRefresh" type="button">↻ Обновить ленту</button>
      <button class="btn primary" id="btnRunAction" type="button">⚡ Запустить сбор в GitHub</button>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab-btn" role="tab" data-tab="stories" aria-selected="true">🔥 Сюжеты (<span id="cntStories">0</span>)</button>
      <button class="tab-btn" role="tab" data-tab="raw" aria-selected="false">📡 Сырая лента (<span id="cntRaw">0</span>)</button>
      <button class="tab-btn" role="tab" data-tab="health" aria-selected="false">🩺 Источники (26)</button>
      <button class="tab-btn" role="tab" data-tab="issues" aria-selected="false">📬 Выпуски LinkedIn (<span id="cntIssues">0</span>)</button>
    </div>
    <div class="row" id="filterBar">
      <input id="q" class="search" type="search" placeholder="Поиск по заголовку, саммари, тегам, источнику…">
      <div class="chips" id="statusChips">
        <button type="button" data-filter="all" aria-pressed="true">Все</button>
        <button type="button" data-filter="eligible" aria-pressed="false">★ Топ (Confirmed ≥ 3.5)</button>
        <button type="button" data-filter="confirmed" aria-pressed="false">✓ Confirmed</button>
        <button type="button" data-filter="t1" aria-pressed="false">T1 Official</button>
        <button type="button" data-filter="marketing" aria-pressed="false">Marketing / Ops / Agents</button>
      </div>
      <div class="chips" id="dayChips">
        <button type="button" data-days="1" aria-pressed="false">24ч</button>
        <button type="button" data-days="3" aria-pressed="false">3 дн</button>
        <button type="button" data-days="7" aria-pressed="true">7 дн</button>
        <button type="button" data-days="14" aria-pressed="false">14 дн</button>
      </div>
    </div>
  </div>
</header>

<main class="gutter">
  <div class="inner">
    <div class="kpis" id="kpiBar"></div>
    <div id="viewStories" style="margin-top:16px"></div>
    <div id="viewRaw" style="margin-top:16px" hidden></div>
    <div id="viewHealth" style="margin-top:16px" hidden></div>
    <div id="viewIssues" style="margin-top:16px" hidden></div>
  </div>
</main>

<div class="tray" id="tray" hidden>
  <div class="inner">
    <div>
      <b id="trayCount">Выбрано: 0</b>
      <span class="meta" style="margin-left:8px">Отметь 3–5 сюжетов для пятничного выпуска AI Weekly</span>
    </div>
    <div class="row">
      <button class="btn" id="btnClearPick" type="button">Сбросить</button>
      <button class="btn" id="btnCopyLinks" type="button">🔗 Скопировать ссылки</button>
      <button class="btn primary" id="btnCopyDraft" type="button">📋 Скопировать пакет для драфта</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script>
(function () {
  "use strict";
  var EMBED = null;
  var FEED_URL = "https://raw.githubusercontent.com/Khanchic/dashboards/main/ai-weekly/feed.json";
  var FEED_FALLBACK = "./feed.json";
  var WORKFLOW_API = "https://api.github.com/repos/Khanchic/dashboards/actions/workflows/ai-weekly-collect.yml/dispatches";
  var LS_PICK = "aiweekly.picked", LS_TOK = "codewords.gh";

  var state = {
    data: EMBED,
    tab: "stories",
    filter: "all",
    days: 7,
    q: "",
    picked: new Set(JSON.parse(localStorage.getItem(LS_PICK) || "[]"))
  };

  function toast(msg) {
    var el = document.getElementById("toast");
    el.textContent = msg;
    el.hidden = false;
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { el.hidden = true; }, 2600);
  }
  function savePicked() {
    localStorage.setItem(LS_PICK, JSON.stringify(Array.from(state.picked)));
    var tray = document.getElementById("tray");
    tray.hidden = state.picked.size === 0;
    document.getElementById("trayCount").textContent = "Выбрано сюжетов: " + state.picked.size;
  }
  function esc(s) {
    return String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function fmtDate(iso) {
    if (!iso) return "—";
    return String(iso).slice(0, 16).replace("T", " ");
  }
  function ageDays(iso) {
    if (!iso) return 0;
    var t = Date.parse(iso);
    return isNaN(t) ? 0 : (Date.now() - t) / 864e5;
  }

  function renderKpis(d) {
    var t = d.totals || {};
    var stories = d.stories || [];
    var conf = stories.filter(function (s) { return s.status === "confirmed"; }).length;
    var elig = stories.filter(function (s) { return s.status === "confirmed" && (s.total || 0) >= 3.5; }).length;
    var okSrc = (d.sources_report || []).filter(function (s) { return !s.error; }).length;
    var totSrc = (d.sources_report || []).length || 26;
    document.getElementById("kpiBar").innerHTML = [
      { v: stories.length, l: "Сюжетов в пуле (14 дн)" },
      { v: conf, l: "✓ Confirmed (T1 / ≥2 домена)" },
      { v: elig, l: "★ Топ-кандидаты (Score ≥ 3.5)" },
      { v: (d.raw_items || []).length, l: "Сырых новостей в базе" },
      { v: "+" + (t.new_items || 0), l: "Новых за последний сбор" },
      { v: okSrc + "/" + totSrc, l: "Источников онлайн (GitHub Actions)" }
    ].map(function (k) {
      return '<div class="kpi"><div class="v">' + esc(k.v) + '</div><div class="l">' + esc(k.l) + '</div></div>';
    }).join("");
    document.getElementById("cntStories").textContent = stories.length;
    document.getElementById("cntRaw").textContent = (d.raw_items || []).length;
    document.getElementById("cntIssues").textContent = (d.issues || []).length;
    document.getElementById("syncMeta").textContent = "Обновлено: " + fmtDate(d.generated_at) + " UTC · GitHub Actions (3×/день)";
  }

  function matchesStory(s) {
    if (state.days && ageDays(s.last_update || s.first_seen) > state.days + 0.5) return false;
    if (state.filter === "eligible" && !(s.status === "confirmed" && (s.total || 0) >= 3.5)) return false;
    if (state.filter === "confirmed" && s.status !== "confirmed") return false;
    if (state.filter === "t1" && !s.has_t1) return false;
    if (state.filter === "marketing") {
      var blob = (s.title + " " + (s.summary || "") + " " + (s.so_what || "") + " " + (s.tags || []).join(" ")).toLowerCase();
      if (!/(marketing|smm|crm|seo|search|agent|automation|workflow|igaming|sales|martech|content)/.test(blob)) return false;
    }
    if (state.q) {
      var q = state.q.toLowerCase();
      var hay = (s.title + " " + (s.title_ru || "") + " " + (s.summary || "") + " " + (s.summary_ru || "") + " " + (s.so_what || "") + " " + (s.so_what_ru || "") + " " + (s.tags || []).join(" ") + " " + (s.domains || []).join(" ")).toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  }

  function renderStories() {
    var d = state.data;
    if (!d) return;
    var list = (d.stories || []).filter(matchesStory);
    var box = document.getElementById("viewStories");
    if (!list.length) {
      box.innerHTML = '<p style="color:var(--faint);text-align:center;padding:40px 0">Нет сюжетов под выбранные фильтры.</p>';
      return;
    }
    box.innerHTML = '<div class="grid">' + list.map(function (s) {
      var isPicked = state.picked.has(s.story_id);
      var color = s.status === "confirmed" && (s.total || 0) >= 3.5 ? "var(--ok)" : (s.status === "confirmed" ? "var(--brand)" : "var(--line-strong)");
      var items = s.items || [];
      return '<article class="card' + (isPicked ? ' selected' : '') + '" style="--c:' + color + '" data-id="' + esc(s.story_id) + '">' +
        '<div class="card-head">' +
          '<div class="badges">' +
            '<span class="b score">★ ' + esc((s.total || 0).toFixed(2)) + '</span>' +
            '<span class="b ' + (s.status === "confirmed" ? "confirmed" : "unconfirmed") + '">' +
              (s.status === "confirmed" ? "✓ Confirmed" : "Unconfirmed") +
            '</span>' +
            (s.has_t1 ? '<span class="b t1">T1</span>' : '') +
            (s.kind ? '<span class="b kind">' + esc(s.kind) + '</span>' : '') +
            '<span class="b">' + items.length + ' ист.</span>' +
          '</div>' +
          '<label class="pick-label"><input type="checkbox" class="pick-cb" data-id="' + esc(s.story_id) + '"' + (isPicked ? ' checked' : '') + '>В драфт</label>' +
        '</div>' +
        '<div>' +
          '<h3 class="t">' + esc(s.title) + '</h3>' +
          (s.title_ru ? '<div class="t-ru">🇷🇺 ' + esc(s.title_ru) + '</div>' : '') +
        '</div>' +
        ((s.summary || s.summary_ru) ? '<div>' +
          (s.summary ? '<p class="sum">' + esc(s.summary) + '</p>' : '') +
          (s.summary_ru ? '<p class="sum-ru">' + esc(s.summary_ru) + '</p>' : '') +
        '</div>' : '') +
        ((s.so_what || s.so_what_ru) ? '<div class="sowhat">' +
          (s.so_what ? '<div><b>So what:</b> ' + esc(s.so_what) + '</div>' : '') +
          (s.so_what_ru ? '<div class="sowhat-ru"><b>Зачем нам:</b> ' + esc(s.so_what_ru) + '</div>' : '') +
        '</div>' : '') +
        ((s.tags && s.tags.length) ? '<div class="tags">' + s.tags.map(function (t) { return '<span class="tag">#' + esc(t) + '</span>'; }).join("") + '</div>' : '') +
        '<div class="sources-list">' +
          items.slice(0, 4).map(function (it) {
            return '<div class="src-item">' +
              '<a href="' + esc(it.url) + '" target="_blank" rel="noopener">[' + esc(it.tier) + ' · ' + esc(it.source) + '] ' + esc(it.title) + '</a>' +
              '<span class="src-meta">' + esc(String(it.published_at || "").slice(0, 10)) + '</span>' +
            '</div>';
          }).join("") +
        '</div>' +
      '</article>';
    }).join("") + '</div>';

    box.querySelectorAll(".pick-cb").forEach(function (cb) {
      cb.addEventListener("change", function () {
        var id = cb.getAttribute("data-id");
        if (cb.checked) state.picked.add(id);
        else state.picked.delete(id);
        savePicked();
        renderStories();
      });
    });
  }

  function renderRaw() {
    var d = state.data;
    if (!d) return;
    var q = state.q.toLowerCase();
    var rows = (d.raw_items || []).filter(function (it) {
      if (state.days && ageDays(it.published_at) > state.days + 0.5) return false;
      if (state.filter === "t1" && it.tier !== "T1") return false;
      if (q && (it.title + " " + (it.summary || "") + " " + it.source_name + " " + it.domain).toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
    document.getElementById("viewRaw").innerHTML =
      '<table class="tbl"><thead><tr><th>Дата</th><th>Tier</th><th>Источник</th><th>Заголовок</th></tr></thead><tbody>' +
      rows.slice(0, 250).map(function (it) {
        return '<tr>' +
          '<td style="font-family:var(--mono);white-space:nowrap;color:var(--dim)">' + esc(String(it.published_at || it.collected_on || "").slice(0, 10)) + '</td>' +
          '<td><span class="b ' + (it.tier === "T1" ? "t1" : "") + '">' + esc(it.tier) + '</span></td>' +
          '<td style="white-space:nowrap">' + esc(it.source_name) + '</td>' +
          '<td><a href="' + esc(it.url) + '" target="_blank" rel="noopener"><b>' + esc(it.title) + '</b></a>' +
            (it.summary ? '<div style="color:var(--dim);font-size:12px;margin-top:2px">' + esc(it.summary.slice(0, 180)) + '</div>' : '') +
          '</td>' +
        '</tr>';
      }).join("") +
      '</tbody></table>';
  }

  function renderHealth() {
    var d = state.data;
    if (!d) return;
    var list = d.sources_report || [];
    document.getElementById("viewHealth").innerHTML =
      '<table class="tbl"><thead><tr><th>Tier</th><th>Источник</th><th>Тип</th><th>Статус</th><th>Fetched</th><th>Kept (7d)</th><th>New</th><th>Заметка / Ошибка</th></tr></thead><tbody>' +
      list.map(function (s) {
        var st = s.error ? '<span class="b" style="background:var(--bad-soft);color:var(--bad)">ERROR</span>'
          : (s.fetched === 0 ? '<span class="b unconfirmed">EMPTY</span>' : '<span class="b confirmed">OK</span>');
        return '<tr>' +
          '<td><span class="b ' + (s.tier === "T1" ? "t1" : "") + '">' + esc(s.tier) + '</span></td>' +
          '<td><a href="' + esc(s.url || "#") + '" target="_blank" rel="noopener"><b>' + esc(s.name || s.id) + '</b></a></td>' +
          '<td style="font-family:var(--mono)">' + esc(s.type) + '</td>' +
          '<td>' + st + '</td>' +
          '<td style="font-family:var(--mono)">' + esc(s.fetched) + '</td>' +
          '<td style="font-family:var(--mono)">' + esc(s.kept) + '</td>' +
          '<td style="font-family:var(--mono);color:var(--brand)"><b>' + esc(s.new) + '</b></td>' +
          '<td style="color:var(--dim);font-size:12px">' + esc(s.error || s.note || "—") + '</td>' +
        '</tr>';
      }).join("") +
      '</tbody></table>';
  }

  function liveTranslateRu(text, targetEl) {
    if (!text) return;
    var url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ru&dt=t&q=" + encodeURIComponent(text);
    fetch(url)
      .then(function (r) { return r.json(); })
      .then(function (j) {
        var out = (j && j[0] || []).map(function (seg) { return seg && seg[0] || ""; }).join("");
        if (out && targetEl) targetEl.textContent = out;
      })
      .catch(function () {
        if (targetEl) targetEl.textContent = "Не удалось загрузить автоперевод.";
      });
  }

  function renderIssues() {
    var d = state.data;
    if (!d) return;
    var issues = d.issues || [];
    var box = document.getElementById("viewIssues");
    box.innerHTML = issues.map(function (iss, idx) {
      var badge = iss.status === "published"
        ? '<span class="b confirmed">✓ PUBLISHED · ' + esc(iss.date) + '</span>'
        : '<span class="b unconfirmed">DRAFT · ' + esc(iss.date) + '</span>';
      var link = iss.linkedin_url
        ? '<a class="btn" href="' + esc(iss.linkedin_url) + '" target="_blank" rel="noopener">🔗 Открыть пост в LinkedIn</a>'
        : '';
      return '<div class="issue-card">' +
        '<div class="row">' +
          '<h3 class="t" style="margin:0">AI Weekly #' + esc(iss.issue || "?") + ' (' + esc(iss.date) + ')</h3>' +
          badge +
          '<span class="spacer"></span>' +
          link +
        '</div>' +
        '<div class="issue-cols">' +
          '<div class="issue-col">' +
            '<div class="issue-col-head">' +
              '<span class="lang-tag">🇬🇧 Оригинал для LinkedIn (EN)</span>' +
              '<button type="button" class="copy-mini" data-copy-idx="' + idx + '" data-copy-lang="en">📋 Копировать EN</button>' +
            '</div>' +
            '<pre id="iss-en-' + idx + '">' + esc(iss.post_md || "") + '</pre>' +
          '</div>' +
          '<div class="issue-col">' +
            '<div class="issue-col-head">' +
              '<span class="lang-tag">🇷🇺 Перевод на русский (RU)</span>' +
              '<button type="button" class="copy-mini" data-copy-idx="' + idx + '" data-copy-lang="ru">📋 Копировать RU</button>' +
            '</div>' +
            '<pre class="ru-pre" id="iss-ru-' + idx + '">' + esc(iss.post_ru || "Перевод загружается…") + '</pre>' +
          '</div>' +
        '</div>' +
      '</div>';
    }).join("") || '<p style="color:var(--faint)">Выпусков пока нет.</p>';

    issues.forEach(function (iss, idx) {
      if (!iss.post_ru && iss.post_md) {
        liveTranslateRu(iss.post_md, document.getElementById("iss-ru-" + idx));
      }
    });

    box.querySelectorAll(".copy-mini").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var idx = btn.getAttribute("data-copy-idx");
        var lang = btn.getAttribute("data-copy-lang");
        var pre = document.getElementById("iss-" + lang + "-" + idx);
        if (pre) {
          navigator.clipboard.writeText(pre.textContent || "").then(function () {
            toast("Текст (" + lang.toUpperCase() + ") скопирован!");
          });
        }
      });
    });
  }

  function renderAll() {
    if (!state.data) return;
    renderKpis(state.data);
    document.getElementById("viewStories").hidden = state.tab !== "stories";
    document.getElementById("viewRaw").hidden = state.tab !== "raw";
    document.getElementById("viewHealth").hidden = state.tab !== "health";
    document.getElementById("viewIssues").hidden = state.tab !== "issues";
    document.getElementById("filterBar").hidden = (state.tab === "health" || state.tab === "issues");
    if (state.tab === "stories") renderStories();
    else if (state.tab === "raw") renderRaw();
    else if (state.tab === "health") renderHealth();
    else if (state.tab === "issues") renderIssues();
    savePicked();
  }

  function loadFeed(bust) {
    if (EMBED && !bust) { state.data = EMBED; renderAll(); return; }
    var q = bust ? "?t=" + Date.now() : "";
    fetch(FEED_URL + q, { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .catch(function () { return fetch(FEED_FALLBACK + q, { cache: "no-store" }).then(function (r) { return r.json(); }); })
      .then(function (d) { state.data = d; renderAll(); if (bust) toast("Лента обновлена"); })
      .catch(function (e) { toast("Ошибка загрузки: " + e.message); });
  }

  document.querySelectorAll(".tab-btn").forEach(function (b) {
    b.addEventListener("click", function () {
      document.querySelectorAll(".tab-btn").forEach(function (x) { x.setAttribute("aria-selected", "false"); });
      b.setAttribute("aria-selected", "true");
      state.tab = b.getAttribute("data-tab");
      renderAll();
    });
  });

  document.querySelectorAll("#statusChips button").forEach(function (b) {
    b.addEventListener("click", function () {
      document.querySelectorAll("#statusChips button").forEach(function (x) { x.setAttribute("aria-pressed", "false"); });
      b.setAttribute("aria-pressed", "true");
      state.filter = b.getAttribute("data-filter");
      renderAll();
    });
  });

  document.querySelectorAll("#dayChips button").forEach(function (b) {
    b.addEventListener("click", function () {
      document.querySelectorAll("#dayChips button").forEach(function (x) { x.setAttribute("aria-pressed", "false"); });
      b.setAttribute("aria-pressed", "true");
      state.days = Number(b.getAttribute("data-days"));
      renderAll();
    });
  });

  document.getElementById("q").addEventListener("input", function (e) {
    state.q = e.target.value.trim();
    renderAll();
  });

  document.getElementById("btnRefresh").addEventListener("click", function () { loadFeed(true); });

  document.getElementById("btnClearPick").addEventListener("click", function () {
    state.picked.clear();
    savePicked();
    renderStories();
  });

  document.getElementById("btnCopyLinks").addEventListener("click", function () {
    var stories = (state.data.stories || []).filter(function (s) { return state.picked.has(s.story_id); });
    var txt = stories.map(function (s, i) {
      var u = (s.items && s.items[0] && s.items[0].url) || "";
      return (i + 1) + ") " + s.title + "\n   " + u;
    }).join("\n\n");
    navigator.clipboard.writeText(txt).then(function () { toast("Ссылки скопированы в буфер!"); });
  });

  document.getElementById("btnCopyDraft").addEventListener("click", function () {
    var stories = (state.data.stories || []).filter(function (s) { return state.picked.has(s.story_id); });
    var payload = stories.map(function (s) {
      return {
        story_id: s.story_id,
        title: s.title,
        total: s.total,
        summary: s.summary,
        so_what: s.so_what,
        sources: (s.items || []).map(function (i) { return { source: i.source, tier: i.tier, url: i.url }; })
      };
    });
    var prompt = "Собери выпуск AI Weekly из выбранных сюжетов:\n\n" + JSON.stringify(payload, null, 2);
    navigator.clipboard.writeText(prompt).then(function () { toast("Пакет для драфта (" + stories.length + " сюж.) скопирован!"); });
  });

  document.getElementById("btnRunAction").addEventListener("click", function () {
    var tok = localStorage.getItem(LS_TOK);
    if (!tok) {
      tok = prompt("Введи GitHub PAT (с правом Actions/Contents на Khanchic/dashboards — сохранится в браузере):");
      if (!tok) return;
      localStorage.setItem(LS_TOK, tok.trim());
    }
    fetch(WORKFLOW_API, {
      method: "POST",
      headers: { Authorization: "Bearer " + tok, Accept: "application/vnd.github+json", "Content-Type": "application/json" },
      body: JSON.stringify({ ref: "main" })
    }).then(function (r) {
      if (r.status === 204 || r.ok) toast("⚡ GitHub Action запущен! Через ~40 сек обнови ленту.");
      else {
        if (r.status === 401 || r.status === 403) localStorage.removeItem(LS_TOK);
        toast("Ошибка запуска GitHub Action: HTTP " + r.status);
      }
    }).catch(function (e) { toast("Ошибка: " + e.message); });
  });

  loadFeed(false);
})();
</script>

<script src="../common/nav.js" defer></script>
</body>
</html>
