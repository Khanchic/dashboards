<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Scarlet Sands Chat Triage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
/* Dark-first: нічна зміна. :root — темна палітра, light перевизначається нижче. */
:root {
  --ground: #141010;
  --panel: #1c1615;
  --panel-2: #241d1b;
  --line: #362b28;
  --line-soft: #2a2220;
  --ink: #e6d9c9;
  --ink-dim: #a8968b;
  --ink-faint: #7a6a62;
  --scarlet: #e04256;
  --scarlet-dim: #8f2634;
  --ember: #eda43c;
  --ember-dim: #7d5620;
  --teal: #4fa287;
  --red: #d8474a;
  --shadow: 0 1px 0 rgba(255,255,255,.03), 0 8px 24px -12px rgba(0,0,0,.7);
  --f-ui: "Archivo", "Segoe UI", system-ui, sans-serif;
  --f-copy: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", monospace;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --ground: #f6f1ea;
    --panel: #fffdfa;
    --panel-2: #f1e9df;
    --line: #ddcfc0;
    --line-soft: #e8ded2;
    --ink: #2a201c;
    --ink-dim: #6b5a51;
    --ink-faint: #938177;
    --scarlet: #bc2337;
    --scarlet-dim: #eebfc4;
    --ember: #a86713;
    --ember-dim: #f0dcbd;
    --teal: #2c7460;
    --red: #b8262b;
    --shadow: 0 1px 2px rgba(80,55,45,.06), 0 10px 24px -16px rgba(80,55,45,.3);
  }
}
:root[data-theme="light"] {
  --ground: #f6f1ea;
  --panel: #fffdfa;
  --panel-2: #f1e9df;
  --line: #ddcfc0;
  --line-soft: #e8ded2;
  --ink: #2a201c;
  --ink-dim: #6b5a51;
  --ink-faint: #938177;
  --scarlet: #bc2337;
  --scarlet-dim: #eebfc4;
  --ember: #a86713;
  --ember-dim: #f0dcbd;
  --teal: #2c7460;
  --red: #b8262b;
  --shadow: 0 1px 2px rgba(80,55,45,.06), 0 10px 24px -16px rgba(80,55,45,.3);
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--f-copy);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.shell { display: flex; flex-direction: column; height: 100vh; min-height: 640px; }

/* ── топбар ───────────────────────────────────────────────── */
.top {
  display: flex; align-items: center; gap: 18px;
  padding: 12px 20px; border-bottom: 1px solid var(--line);
  background: var(--panel); flex-wrap: wrap;
}
.brand { display: flex; align-items: baseline; gap: 10px; flex: 0 0 auto; }
.brand b {
  font-family: var(--f-ui); font-weight: 700; font-size: 17px;
  letter-spacing: -.01em; color: var(--ink);
}
.brand span {
  font-family: var(--f-ui); font-size: 10px; font-weight: 600;
  letter-spacing: .14em; text-transform: uppercase; color: var(--scarlet);
}
.search { flex: 1 1 320px; position: relative; min-width: 260px; }
.search input {
  width: 100%; padding: 9px 14px 9px 34px;
  background: var(--panel-2); color: var(--ink);
  border: 1px solid var(--line); border-radius: 3px;
  font-family: var(--f-mono); font-size: 13px;
}
.search input::placeholder { color: var(--ink-faint); font-family: var(--f-copy); }
.search svg { position: absolute; left: 11px; top: 11px; width: 14px; height: 14px; stroke: var(--ink-faint); fill: none; stroke-width: 2; }
.top-right { display: flex; gap: 8px; align-items: center; }
.tbtn {
  font-family: var(--f-ui); font-size: 11px; font-weight: 600; letter-spacing: .06em;
  text-transform: uppercase; color: var(--ink-dim);
  background: transparent; border: 1px solid var(--line);
  padding: 7px 11px; border-radius: 3px; cursor: pointer;
}
.tbtn:hover { color: var(--ink); border-color: var(--ink-faint); }
.tbtn[aria-pressed="true"] { color: var(--ground); background: var(--ember); border-color: var(--ember); }

/* ── тіло ─────────────────────────────────────────────────── */
.body { display: grid; grid-template-columns: 292px minmax(0,1fr); flex: 1; min-height: 0; }

/* рейка */
.rail { border-right: 1px solid var(--line); overflow-y: auto; background: var(--panel); }
.rail-group { padding: 14px 0 6px; }
.rail-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px 7px; font-family: var(--f-ui); font-size: 10px; font-weight: 700;
  letter-spacing: .13em; text-transform: uppercase; color: var(--ink-faint);
}
.rail-head em { font-style: normal; color: var(--ink-faint); font-weight: 500; letter-spacing: .04em; }
.rail-item {
  display: grid; grid-template-columns: 3px 1fr auto; align-items: center; gap: 10px;
  width: 100%; text-align: left; background: none; border: 0;
  padding: 7px 16px 7px 13px; cursor: pointer;
  font-family: var(--f-ui); font-size: 13.5px; color: var(--ink-dim);
  border-top: 1px solid transparent; border-bottom: 1px solid transparent;
}
.rail-item i { display: block; height: 15px; border-radius: 2px; background: transparent; }
.rail-item:hover { color: var(--ink); background: var(--panel-2); }
.rail-item[aria-current="true"] { color: var(--ink); background: var(--panel-2); font-weight: 600; }
.rail-item[aria-current="true"] i { background: var(--scarlet); }
.rail-item .vol {
  font-family: var(--f-mono); font-size: 10.5px; color: var(--ink-faint);
  font-variant-numeric: tabular-nums;
}
.rail-item.stop { color: var(--red); }
.rail-item.stop:hover, .rail-item.stop[aria-current="true"] { color: var(--red); }
.rail-item.stop[aria-current="true"] i { background: var(--red); }

/* main */
.main { overflow-y: auto; padding: 0 0 60px; }
.wrap { max-width: 940px; padding: 20px 30px; }

.crumbs { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-bottom: 14px; min-height: 22px; }
.crumbs button {
  font-family: var(--f-mono); font-size: 11px; color: var(--ink-dim);
  background: var(--panel-2); border: 1px solid var(--line-soft);
  padding: 3px 8px; border-radius: 2px; cursor: pointer;
}
.crumbs button:hover { color: var(--ink); }
.crumbs s { color: var(--ink-faint); text-decoration: none; font-size: 11px; }

.node-head { border-bottom: 1px solid var(--line); padding-bottom: 16px; margin-bottom: 20px; }
.tagrow { display: flex; gap: 8px; align-items: center; margin-bottom: 9px; flex-wrap: wrap; }
.tag {
  font-family: var(--f-ui); font-size: 10px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; padding: 3px 7px; border-radius: 2px; border: 1px solid;
}
.tag.own { color: var(--teal); border-color: color-mix(in srgb, var(--teal) 45%, transparent); }
.tag.esc { color: var(--ember); border-color: var(--ember-dim); background: color-mix(in srgb, var(--ember) 10%, transparent); }
.tag.stop { color: var(--red); border-color: color-mix(in srgb, var(--red) 50%, transparent); background: color-mix(in srgb, var(--red) 10%, transparent); }
.tag.vol { color: var(--ink-faint); border-color: var(--line); font-family: var(--f-mono); letter-spacing: .02em; }
h1 {
  font-family: var(--f-ui); font-size: 26px; font-weight: 700; letter-spacing: -.015em;
  margin: 0 0 8px; text-wrap: balance; line-height: 1.15;
}
.node-why { color: var(--ink-dim); font-size: 14px; max-width: 66ch; margin: 0; }

.sec { margin-bottom: 26px; }
.sec > h2 {
  font-family: var(--f-ui); font-size: 10.5px; font-weight: 700; letter-spacing: .14em;
  text-transform: uppercase; color: var(--ink-faint); margin: 0 0 10px;
  display: flex; align-items: center; gap: 9px;
}
.sec > h2::after { content: ""; flex: 1; height: 1px; background: var(--line-soft); }

/* тригери — сирий лог */
.trigs { display: flex; flex-wrap: wrap; gap: 6px; }
.trig {
  font-family: var(--f-mono); font-size: 12px; color: var(--ink-dim);
  background: var(--panel); border: 1px solid var(--line-soft);
  border-left: 2px solid var(--scarlet-dim);
  padding: 4px 9px; border-radius: 0 2px 2px 0;
}

/* відповіді */
.replies { display: flex; flex-direction: column; gap: 10px; }
.reply {
  display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: start;
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 3px; padding: 13px 14px; box-shadow: var(--shadow);
}
.reply p { margin: 0; font-size: 15px; line-height: 1.5; }
.reply .note {
  margin-top: 7px; font-family: var(--f-ui); font-size: 11.5px; color: var(--ink-faint);
  display: flex; gap: 6px;
}
.reply .note b { color: var(--ember); font-weight: 600; flex: 0 0 auto; }
.copy {
  font-family: var(--f-ui); font-size: 10px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: var(--ink-dim);
  background: var(--panel-2); border: 1px solid var(--line);
  padding: 6px 10px; border-radius: 2px; cursor: pointer; white-space: nowrap;
}
.copy:hover { color: var(--ink); border-color: var(--ink-faint); }
.copy.done { color: var(--teal); border-color: color-mix(in srgb, var(--teal) 50%, transparent); }

/* хук */
.hook {
  border-left: 2px solid var(--ember); background: color-mix(in srgb, var(--ember) 7%, transparent);
  padding: 12px 14px; border-radius: 0 3px 3px 0;
  display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center;
}
.hook p { margin: 0; font-size: 15px; }
.hook .lbl {
  font-family: var(--f-ui); font-size: 10px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: var(--ember); display: block; margin-bottom: 5px;
}

/* гілки */
.branches { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.branch {
  text-align: left; background: var(--panel); border: 1px solid var(--line);
  border-radius: 3px; padding: 11px 13px; cursor: pointer; color: var(--ink);
  display: grid; gap: 4px;
}
.branch:hover { border-color: var(--scarlet); }
.branch b { font-family: var(--f-mono); font-size: 12px; font-weight: 500; color: var(--ink); }
.branch s { text-decoration: none; font-family: var(--f-ui); font-size: 11px; color: var(--ink-faint); }
.branch:hover s { color: var(--ink-dim); }

/* заборони */
.never { display: flex; flex-direction: column; gap: 6px; }
.never li {
  list-style: none; font-size: 13.5px; color: var(--ink-dim);
  display: grid; grid-template-columns: 14px 1fr; gap: 9px;
}
.never li::before { content: "×"; color: var(--red); font-family: var(--f-mono); font-weight: 500; }
ul.never { margin: 0; padding: 0; }

/* ескалація */
.esc-box {
  border: 1px solid var(--ember-dim); background: color-mix(in srgb, var(--ember) 8%, transparent);
  border-radius: 3px; padding: 13px 14px;
}
.esc-box .lbl {
  font-family: var(--f-ui); font-size: 10px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; color: var(--ember); display: block; margin-bottom: 6px;
}
.esc-box p { margin: 0; font-size: 14px; color: var(--ink); }

/* пошук-результати */
.results { display: flex; flex-direction: column; gap: 8px; }
.result {
  text-align: left; background: var(--panel); border: 1px solid var(--line);
  border-left: 2px solid var(--ember); border-radius: 0 3px 3px 0;
  padding: 11px 13px; cursor: pointer; display: grid; gap: 5px;
}
.result:hover { border-color: var(--scarlet); border-left-color: var(--scarlet); }
.result b { font-family: var(--f-ui); font-size: 14.5px; color: var(--ink); font-weight: 600; }
.result s { text-decoration: none; font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-faint); }
.result mark { background: color-mix(in srgb, var(--ember) 28%, transparent); color: var(--ink); border-radius: 1px; }
.empty { color: var(--ink-faint); font-size: 14px; }

/* дошка правил */
.rules { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
.rule {
  background: var(--panel); border: 1px solid var(--line); border-radius: 3px; padding: 12px 13px;
}
.rule .k {
  font-family: var(--f-ui); font-size: 10px; font-weight: 700; letter-spacing: .11em;
  text-transform: uppercase; color: var(--scarlet); display: block; margin-bottom: 6px;
}
.rule p { margin: 0; font-size: 13.5px; color: var(--ink-dim); }
.rule p + p { margin-top: 6px; }
.rule code { font-family: var(--f-mono); font-size: 12.5px; color: var(--ink); }

table.levers { width: 100%; border-collapse: collapse; font-size: 13.5px; }
table.levers th, table.levers td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
table.levers th {
  font-family: var(--f-ui); font-size: 10px; font-weight: 700; letter-spacing: .11em;
  text-transform: uppercase; color: var(--ink-faint);
}
table.levers td:first-child { font-family: var(--f-mono); font-size: 12.5px; color: var(--ember); white-space: nowrap; }
.tblwrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 3px; background: var(--panel); }

.gap { display: grid; grid-template-columns: 1fr; gap: 8px; }
.gap li {
  list-style: none; background: var(--panel); border: 1px dashed var(--line);
  border-left: 2px solid var(--scarlet); padding: 10px 12px; border-radius: 0 3px 3px 0; font-size: 13.5px;
}
.gap li b { font-family: var(--f-ui); color: var(--ink); }
ul.gap { margin: 0; padding: 0; }

@media (max-width: 860px) {
  .body { grid-template-columns: 1fr; }
  .rail { border-right: 0; border-bottom: 1px solid var(--line); max-height: 210px; }
  .shell { height: auto; min-height: 100vh; }
  .wrap { padding: 18px; }
}
</style>

<div class="shell">
  <header class="top">
    <div class="brand"><b>Chat Triage</b><span>Scarlet Sands · night</span></div>
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16 16l5 5"/></svg>
      <input id="q" type="search" placeholder="Встав повідомлення юзера або ключове слово — знайде гілку" autocomplete="off" spellcheck="false">
    </div>
    <div class="top-right">
      <button class="tbtn" id="btn-rules">Правила зміни</button>
      <button class="tbtn" id="btn-theme" aria-pressed="false">Світло</button>
    </div>
  </header>

  <div class="body">
    <nav class="rail" id="rail" aria-label="Інтенти"></nav>
    <main class="main"><div class="wrap" id="stage"></div></main>
  </div>
</div>

<script>
/* ─────────────────────────────────────────────────────────────
   ДАНІ. Частки трафіку — з розбору 105 643 живих повідомлень
   чату Scarlet Sands за 05.03–26.08.2026 (127 152 рядки всього,
   мінус QA-сміття та клавіатурна каша).
   ───────────────────────────────────────────────────────────── */

const GROUPS = [
  { id: 'promo',  title: 'Промокоди', note: '≈ 60% роботи' },
  { id: 'money',  title: 'Гроші та акаунт', note: 'ескалація' },
  { id: 'mood',   title: 'Настрій і конфлікт', note: '' },
  { id: 'comm',   title: 'Комʼюніті', note: 'залучення' },
  { id: 'stop',   title: 'Червоні прапорці', note: 'протокол' },
];

const N = {

/* ══════════ ПРОМОКОДИ ══════════ */

'beg': {
  g: 'promo', t: 'Просять код: «any codes?»', vol: '6 097',
  role: 'own',
  why: 'Найчастіший запит у чаті. Це не разове питання, а фон: «codes?», «code please», «any codes» ідуть пачками щогодини. Відповідати треба так, щоб людина лишилася в чаті й після «ні», інакше вона піде й повернеться через 10 хвилин з тим самим питанням.',
  trigs: ['any codes?', 'code please', 'codes', 'Anyone got a code for me?', "I'm new any codes?", 'admin you have any codes?', 'In need of a code plz', 'Please please please code'],
  replies: [
    { t: "Hey! I hear you 👋 Codes drop here through the night, not on a fixed clock — so hanging out in chat is genuinely the best way to catch one. What are you playing right now?", n: 'База, коли коду на руках немає. Ніколи не відповідай просто «no».' },
    { t: "No code from me this second, but the room is warm tonight — players drop theirs here all the time. Stick around and tell me how your session is going, I want to hear it 🔥", n: 'Перекидає надію на комʼюніті й одразу тягне розмову.' },
    { t: "Got you 👀 Dropping one in a moment — first, who's actually still awake in here? Say hey so I know who I'm playing with tonight.", n: 'Тільки якщо реально збираєшся дропнути код. Пообіцяв — дай.' },
  ],
  hook: "Quick one while you wait — what's the last game that actually paid you something? I'm collecting tonight's list 🎰",
  never: ['Обіцяти код «через 5 хвилин», якщо не збираєшся дропати — у цьому чаті памʼятають і цитують', 'Писати сухе «no» або «not now» без питання услід', 'Казати, що коди видаються за розкладом — їх і так чекають по годинах'],
  br: [
    { l: 'Продовжує довбати: «please please code»', to: 'beg-push' },
    { l: 'Пише, що він новий на сайті', to: 'newbie' },
    { l: 'Код узяв, але «limit reached / invalid»', to: 'code-dead' },
    { l: 'Чат млявий, ніхто не відповідає', to: 'dead' },
    { l: 'Вимагає саме адмінський код', to: 'admin-code' },
  ],
},

'beg-push': {
  g: 'promo', t: 'Тисне після відмови', vol: '~1 200',
  role: 'own',
  why: 'Після «ні» частина юзерів переходить у спам-режим або в образу: «Like really nobody is going to share a code come on», «There\'s 91 people n nobody wants to help?». Завдання — не читати моралі, а перевести енергію в активність.',
  trigs: ['Like really nobody is going to share a code come on', "There's 91 people n nobody wants to help ?", 'DROP SOME PROMO', 'drop promo pls', 'Okay drop one today please', 'Why dont you drop 1'],
  replies: [
    { t: "I get the frustration, for real. I can't conjure one on demand — but I'm watching this room all night and I do notice who's actually here. Keep me company and you'll be first in line 👀", n: 'Дає статус замість коду. Працює краще за відмову.' },
    { t: "Easy 😄 Begging doesn't move the needle, but being the person who makes this chat fun absolutely does. Tell me your biggest win on Scarlet Sands and let's get the room talking.", n: 'Мʼяко зупиняє спам і одразу дає завдання.' },
  ],
  hook: "Serious question for the room: what's the one game you'd tell a new player to open first? Best answer gets my attention tonight ⚡",
  never: ['Відповідати роздратуванням або сарказмом — скриншотять', 'Мутити чи попереджати за одне «please» — це не спам, це норма чату', 'Здаватися й видавати код лише тому, що задавили'],
  br: [
    { l: 'Перейшов на образи', to: 'toxic' },
    { l: 'Почав флудити одним і тим самим', to: 'spam' },
    { l: 'Заспокоївся й заговорив', to: 'dead' },
  ],
},

'code-dead': {
  g: 'promo', t: '«Limit reached» / «invalid» / «unavailable»', vol: '751',
  role: 'own',
  why: 'Головне джерело злості в чаті. У кодів гравців є ліміт активацій, і його виїдають за секунди: «All limit reached within 2 seconds», «Limit reached like BAM!». Юзер думає, що його обманули, а не що він запізнився. Поясни механіку — і злість зникає.',
  trigs: ['says limit reached', 'This one said unavailable', 'That code is invalid', 'None of those codes work', 'All limit reached', 'no codes for me to use and that promo code is used up', 'any new code that isnt limit reached'],
  replies: [

  never: ['Коментувати, чи повʼязані бренди між собою', 'Роздавати коди інших проєктів', 'Лишати пропозицію глітча без реакції'],
  br: [
    { l: 'Продовжує продавати глітч', to: 'spam' },
    { l: 'Просто балакає про інші сайти', to: 'smalltalk' },
  ],
},

'spam': {
  g: 'stop', t: 'Спам і вперте порушення', vol: '~500',
  role: 'stop',
  why: 'Фінальна гілка для всіх, хто не зупинився після двох прохань: флуд одним і тим самим, платіжні теги, вербування, цькування. Порядок дій має бути один і той самий, щоб зміни не вирішували на око.',
  trigs: ['повтор одного повідомлення поспіль', 'платіжний тег після прохання прибрати', 'вербування після попередження', 'цькування конкретного гравця'],
  replies: [
    { t: "Last ask: stop posting that here 🙏 Next step isn't up to me.", n: 'Фінальне попередження. Коротко, без суперечки.' },
  ],
  esc: 'Порядок: (1) спокійне прохання, (2) пряме попередження, (3) модерація за правилами платформи. Кожен випадок — у звіт зміни: нік, час, що порушував, що зробив ти. Точні права на мут/бан підтвердити в support.',
  never: ['Сперечатися публічно й пояснювати правила тричі', 'Карати без двох попереджень (крім глітчів і RG-випадків)', 'Обговорювати покарання з чатом'],
  br: [
    { l: 'Зупинився', to: 'smalltalk' },
  ],
},

};

/* ═══════════ РЕНДЕР ═══════════ */

const stage = document.getElementById('stage');
const rail = document.getElementById('rail');
const qEl = document.getElementById('q');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

let trail = [];

/* рейка */
rail.innerHTML = GROUPS.map(g => {
  const items = Object.entries(N).filter(([, n]) => n.g === g.id);
  return `<div class="rail-group">
    <div class="rail-head"><span>${esc(g.title)}</span>${g.note ? `<em>${esc(g.note)}</em>` : ''}</div>
    ${items.map(([id, n]) => `<button class="rail-item${n.role === 'stop' ? ' stop' : ''}" data-go="${id}">
      <i></i><span>${esc(n.t)}</span><span class="vol">${esc(n.vol)}</span>
    </button>`).join('')}
  </div>`;
}).join('');

function roleTag(role) {
  if (role === 'stop') return '<span class="tag stop">Протокол · не імпровізувати</span>';
  if (role === 'esc') return '<span class="tag esc">Ескалація в support</span>';
  return '<span class="tag own">Відповідаєш сам</span>';
}

function render(id, push = true) {
  const n = N[id];
  if (!n) return;
  if (push) {
    const at = trail.indexOf(id);
    trail = at >= 0 ? trail.slice(0, at + 1) : [...trail, id];
  }
  try { localStorage.setItem('sscl:last', id); } catch (e) { /* приватний режим — не критично */ }

  rail.querySelectorAll('.rail-item').forEach(b =>
    b.setAttribute('aria-current', b.dataset.go === id ? 'true' : 'false'));

  const crumbs = trail.length > 1
    ? trail.map((t, i) => `${i ? '<s>›</s>' : ''}<button data-go="${t}" data-crumb="1">${esc(N[t].t)}</button>`).join('')
    : '';

  stage.innerHTML = `
    <div class="crumbs">${crumbs}</div>
    <div class="node-head">
      <div class="tagrow">${roleTag(n.role)}<span class="tag vol">${esc(n.vol)} повідомлень у базі</span></div>
      <h1>${esc(n.t)}</h1>
      <p class="node-why">${esc(n.why)}</p>
    </div>

    <section class="sec">
      <h2>Як це звучить у чаті</h2>
      <div class="trigs">${n.trigs.map(t => `<span class="trig">${esc(t)}</span>`).join('')}</div>
    </section>

    <section class="sec">
      <h2>Що відповідати</h2>
      <div class="replies">${n.replies.map(r => `
        <div class="reply">
          <div>
            <p>${esc(r.t)}</p>
            ${r.n ? `<div class="note"><b>↳</b><span>${esc(r.n)}</span></div>` : ''}
          </div>
          <button class="copy" data-copy="${esc(r.t)}">Копіювати</button>
        </div>`).join('')}
      </div>
    </section>

    ${n.hook ? `<section class="sec">
      <h2>Хук: чим затягнути в розмову</h2>
      <div class="hook">
        <div><span class="lbl">Кидай услід за відповіддю</span><p>${esc(n.hook)}</p></div>
        <button class="copy" data-copy="${esc(n.hook)}">Копіювати</button>
      </div>
    </section>` : ''}

    ${n.esc ? `<section class="sec">
      <h2>Порядок дій</h2>
      <div class="esc-box"><span class="lbl">${n.role === 'stop' ? 'Протокол' : 'Ескалація'}</span><p>${esc(n.esc)}</p></div>
    </section>` : ''}

    ${n.never ? `<section class="sec">
      <h2>Чого не робити</h2>
      <ul class="never">${n.never.map(x => `<li><span>${esc(x)}</span></li>`).join('')}</ul>
    </section>` : ''}

    ${n.br && n.br.length ? `<section class="sec">
      <h2>Юзер відповів → куди далі</h2>
      <div class="branches">${n.br.map(b => `
        <button class="branch" data-go="${b.to}">
          <b>«${esc(b.l)}»</b><s>→ ${esc(N[b.to] ? N[b.to].t : b.to)}</s>
        </button>`).join('')}
      </div>
    </section>` : ''}
  `;
  document.querySelector('.main').scrollTop = 0;
}

/* правила зміни */
function renderRules() {
  trail = [];
  rail.querySelectorAll('.rail-item').forEach(b => b.setAttribute('aria-current', 'false'));
  stage.innerHTML = `
    <div class="crumbs"></div>
    <div class="node-head">
      <div class="tagrow"><span class="tag own">Читати перед кожною зміною</span></div>
      <h1>Правила зміни</h1>
      <p class="node-why">Пʼять речей, які діють завжди, у будь-якій гілці. Усе інше — у дереві ліворуч.</p>
    </div>

    <section class="sec">
      <h2>Завжди</h2>
      <div class="rules">
        <div class="rule"><span class="k">Мова</span><p>Тільки англійська. Юзери — США. Жодних перекладів, навіть якщо написали не англійською.</p></div>
        <div class="rule"><span class="k">Кожна відповідь — із питанням</span><p>Відповідь без питання закриває розмову. «Ок», «np», «you're welcome» — заборонені як самостійні повідомлення.</p></div>
        <div class="rule"><span class="k">Не обіцяй того, чого не бачиш</span><p>Строки виплат, статуси, суми, нарахування, ліміти в цифрах — тільки support. Твоя зона: чат, коди, механіки, настрій.</p></div>
        <div class="rule"><span class="k">Сказав «дам код» — дай</span><p>Чат памʼятає й цитує. Одна невиконана обіцянка витрачається довше, ніж десять виданих кодів.</p></div>
        <div class="rule"><span class="k">Не повторюйся</span><p>У кожній гілці 2–3 варіанти відповіді. Одна й та сама фраза тричі за годину читається як бот.</p></div>
      </div>
    </section>

    <section class="sec">
      <h2>Промо-важелі у твоїх руках</h2>
      <div class="tblwrap"><table class="levers">
        <thead><tr><th>Що даєш</th><th>Коли</th><th>Як подавати</th></tr></thead>
        <tbody>
          <tr><td>Offer code</td><td>Розгін активності, відповідь на хвилю запитів</td><td>Як подію для всієї кімнати, не в приват одному прохачу</td></tr>
          <tr><td>FP code</td><td>За активність: людина підтримала розмову, допомогла новачку, поділилася кодом</td><td>Назвати причину вголос — «за те, що тримаєш чат живим»</td></tr>
          <tr><td>SC code</td><td>Сильний момент: розгойдування мертвої години, великий виграш у кімнаті</td><td>З оголошенням і питанням у кімнату</td></tr>
          <tr><td>Свій захід</td><td>Чат затих — можна спитати «who wants a code?» першим</td><td>Спитав → мусиш дати</td></tr>
        </tbody>
      </table></div>
      <p style="color:var(--ink-faint);font-size:12.5px;margin:9px 0 0">Кількість кодів на зміну й частоту треба зафіксувати з support — у чек-листі стоїть заглушка.</p>
    </section>

    <section class="sec">
      <h2>Миттєва ескалація, без обговорення</h2>
      <ul class="never">
        <li><span>Кешаути, виплати, «де мої гроші» → support</span></li>
        <li><span>KYC, документи, ID → support. Документи в чаті не запитувати ніколи</span></li>
        <li><span>Платіжки, депозити, чарджі → support</span></li>
        <li><span>Баги: зібрати гру + текст помилки + пристрій, передати команді</span></li>
        <li><span>Відповідальна гра (rent, food, kids, «last dollar», addict) → протокол RG, нуль промо</span></li>
        <li><span>Пропозиція глітча або експлойта → погасити одразу, зафіксувати нік і час</span></li>
      </ul>
    </section>

    <section class="sec">
      <h2>Що треба підтвердити в support</h2>
      <ul class="gap">
        <li><b>Точний шлях введення промокоду</b> в інтерфейсі — зараз у відповідях формулювання загальне.</li>
        <li><b>Ліміт кодів на гравця на день</b> і строк життя коду — юзери питають прямо, відповіді немає.</li>
        <li><b>«DAILY BLESSING» і «claim 25»</b> — 1 176 повідомлень із цими ключовиками. Що це, де працює, що відповідати.</li>
        <li><b>Ember Points → код:</b> скільки embers на який код, чому нарахування могло зупинитися.</li>
        <li><b>Норма промо на зміну:</b> скільки offer / FP / SC кодів оператор може видати за ніч і з яким інтервалом.</li>
        <li><b>Права на модерацію:</b> чи може оператор мутити й банити сам, чи тільки ескалювати.</li>
        <li><b>VIP і GC vs SC:</b> чи зараховується гра на gold coins у прокачування рівня — у чаті про це сперечаються.</li>
      </ul>
    </section>
  `;
  document.querySelector('.main').scrollTop = 0;
}

/* пошук */
const INDEX = Object.entries(N).map(([id, n]) => ({
  id, t: n.t,
  hay: (n.t + ' ' + n.why + ' ' + n.trigs.join(' ') + ' ' + n.br.map(b => b.l).join(' ')).toLowerCase(),
}));

function search(raw) {
  const q = raw.trim().toLowerCase();
  if (q.length < 2) { render(trail[trail.length - 1] || 'beg', false); return; }
  const words = q.split(/[^a-zа-яїієґ0-9$@]+/i).filter(w => w.length > 2);
  const scored = INDEX.map(e => {
    let s = 0;
    if (e.hay.includes(q)) s += 40;
    words.forEach(w => { if (e.hay.includes(w)) s += 8; if (e.t.toLowerCase().includes(w)) s += 6; });
    const n = N[e.id];
    const hit = n.trigs.find(t => words.some(w => t.toLowerCase().includes(w)) || t.toLowerCase().includes(q));
    return { ...e, s, hit };
  }).filter(e => e.s > 0).sort((a, b) => b.s - a.s).slice(0, 8);

  const mark = t => {
    let out = esc(t);
    [q, ...words].filter(Boolean).forEach(w => {
      out = out.replace(new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi'), '<mark>$1</mark>');
    });
    return out;
  };

  stage.innerHTML = `
    <div class="crumbs"></div>
    <div class="node-head">
      <div class="tagrow"><span class="tag vol">Пошук</span></div>
      <h1>${scored.length ? 'Схоже на ці гілки' : 'Нічого не знайшлося'}</h1>
      <p class="node-why">${scored.length
        ? 'Обери гілку — відкриється повний сценарій з відповідями.'
        : 'Спробуй одне-два слова з повідомлення юзера: code, limit, withdraw, ember, trade, scam, chime, discord, rent.'}</p>
    </div>
    <div class="results">${scored.map(e => `
      <button class="result" data-go="${e.id}">
        <b>${esc(e.t)}</b>
        ${e.hit ? `<s>${mark(e.hit)}</s>` : ''}
      </button>`).join('')}
    </div>`;
  document.querySelector('.main').scrollTop = 0;
}

/* події */
document.addEventListener('click', e => {
  const go = e.target.closest('[data-go]');
  if (go) {
    if (go.dataset.crumb) trail = trail.slice(0, trail.indexOf(go.dataset.go) + 1);
    if (go.classList.contains('rail-item')) trail = [];
    qEl.value = '';
    render(go.dataset.go, true);
    return;
  }
  const cp = e.target.closest('[data-copy]');
  if (cp) {
    const text = cp.dataset.copy;
    const ok = () => { cp.textContent = 'Скопійовано'; cp.classList.add('done'); setTimeout(() => { cp.textContent = 'Копіювати'; cp.classList.remove('done'); }, 1400); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(ok, () => fallback(text, ok));
    } else fallback(text, ok);
  }
});

function fallback(text, ok) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); ok(); } catch (err) { /* нічого не вдієш */ }
  ta.remove();
}

let tmr;
qEl.addEventListener('input', () => { clearTimeout(tmr); tmr = setTimeout(() => search(qEl.value), 130); });
document.getElementById('btn-rules').addEventListener('click', () => { qEl.value = ''; renderRules(); });

const themeBtn = document.getElementById('btn-theme');
themeBtn.addEventListener('click', () => {
  const light = document.documentElement.getAttribute('data-theme') !== 'light';
  document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
  themeBtn.setAttribute('aria-pressed', String(light));
  themeBtn.textContent = light ? 'Темрява' : 'Світло';
  try { localStorage.setItem('sscl:theme', light ? 'light' : 'dark'); } catch (e) { /* ок */ }
});

/* старт */
(function boot() {
  let t = null, last = null;
  try { t = localStorage.getItem('sscl:theme'); last = localStorage.getItem('sscl:last'); } catch (e) { /* ок */ }
  if (t) {
    document.documentElement.setAttribute('data-theme', t);
    themeBtn.setAttribute('aria-pressed', String(t === 'light'));
    themeBtn.textContent = t === 'light' ? 'Темрява' : 'Світло';
  }
  render(last && N[last] ? last : 'beg', true);
})();
</script>
