<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Scarlet Sands Chat Triage · Dashboards</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{ background:#0d0f0e; color:#e9ebe8;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.45; -webkit-font-smoothing:antialiased; }

  /* ====== shared app shell (identical on every dashboards/* page) ====== */
  .shell{ display:grid; grid-template-columns:190px 1fr; grid-template-rows:52px 1fr; grid-template-areas:"topbar topbar" "sidebar content"; min-height:100vh; }
  @media (max-width:720px){ .shell{ grid-template-columns:1fr; grid-template-areas:"topbar" "sidebar" "content"; } }
  .topbar{ grid-area:topbar; position:sticky; top:0; z-index:60; display:flex; align-items:center; padding:0 20px; background:#15130f; border-bottom:1px solid rgba(255,255,255,.08); }
  .topbar .brand{ color:#f0d29a; font-weight:700; font-size:14px; letter-spacing:.02em; text-decoration:none; }
  .sidebar{ grid-area:sidebar; position:sticky; top:52px; align-self:start; height:calc(100vh - 52px); overflow-y:auto; background:#15130f; border-right:1px solid rgba(255,255,255,.08); padding:18px 12px; }
  @media (max-width:720px){ .sidebar{ position:static; height:auto; border-right:0; border-bottom:1px solid rgba(255,255,255,.08); } }
  .sidebar nav{ display:flex; flex-direction:column; gap:3px; }
  @media (max-width:720px){ .sidebar nav{ flex-direction:row; overflow-x:auto; } }
  .slink{ color:#a8a39a; text-decoration:none; font-size:13px; font-weight:650; letter-spacing:.02em; padding:9px 12px; border-radius:8px; white-space:nowrap; transition:background .12s,color .12s; }
  .slink:hover{ background:rgba(255,255,255,.06); color:#f2efe9; }
  .slink.active{ background:rgba(217,171,76,.16); color:#f0c674; }
  .content{ grid-area:content; min-width:0; }
  /* ====== /shared app shell ====== */

  .frame{ display:block; width:100%; height:calc(100vh - 52px); border:0; }
  @media (max-width:720px){ .frame{ height:calc(100vh - 110px); min-height:560px; } }
</style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/dashboards/">Dashboards</a>
    </header>

    <aside class="sidebar">
      <nav>
        <a href="/dashboards/" class="slink">ГЛАВНАЯ</a>
        <a href="/dashboards/reports/" class="slink">ОТЧЁТЫ</a>
        <a href="/dashboards/planning/" class="slink">ПЛАНИРОВАНИЕ</a>
        <a href="/dashboards/promo-codes/" class="slink">ПРОМОКОДЫ</a>
        <a href="/dashboards/visual/" class="slink">ВИЗУАЛ</a>
        <a href="/dashboards/giveaways/" class="slink">ГИВЕВЕИ</a>
        <a href="/dashboards/poll-breakdown/" class="slink">ОПРОС</a>
        <a href="/dashboards/chat-triage/" class="slink active">ЧЕК-ЛИСТ ЧАТА</a>
      </nav>
    </aside>

    <main class="content">
      <iframe class="frame" src="app.html" title="Scarlet Sands Chat Triage"></iframe>
    </main>
  </div>
</body>
</html>
